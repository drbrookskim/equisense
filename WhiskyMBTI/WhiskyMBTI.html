// ─── App ──────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = React.useState(() => {
    return localStorage.getItem('whiskymbti_screen') || 'splash';
  });
  const [selectedMBTI, setSelectedMBTI] = React.useState(() => {
    return localStorage.getItem('whiskymbti_mbti') || null;
  });
  const [theme, setTheme] = React.useState(TWEAK_DEFAULTS.theme);
  const [cardStyle, setCardStyle] = React.useState(TWEAK_DEFAULTS.cardStyle);
  const [lang, setLang] = React.useState(TWEAK_DEFAULTS.lang);
  const [transitioning, setTransitioning] = React.useState(false);

  // expose tweak setters globally
  React.useEffect(() => {
    window.setTheme = (t) => { setTheme(t); document.querySelectorAll('.tweak-btn').forEach(b => b.classList.remove('active')); };
    window.setCardStyle = (s) => setCardStyle(s);
    window.setLang = (l) => setLang(l);
  }, []);

  const navigate = (s) => {
    setTransitioning(true);
    setTimeout(() => {
      setScreen(s);
      localStorage.setItem('whiskymbti_screen', s);
      setTransitioning(false);
    }, 280);
  };

  const selectMBTI = (type) => {
    setSelectedMBTI(type);
    localStorage.setItem('whiskymbti_mbti', type);
    navigate('result');
  };

  const T = THEMES[theme] || THEMES.dark;
  const whisky = selectedMBTI ? WHISKY_DATA[selectedMBTI] : null;

  const screenProps = { T, navigate, selectMBTI, selectedMBTI, whisky, cardStyle, lang, transitioning };

  return (
    <IOSDevice width={390} height={844} dark={true}>
      <div style={{
        position: 'absolute', inset: 0, overflow: 'hidden',
        background: T.bg,
        opacity: transitioning ? 0 : 1,
        transition: 'opacity 0.28s ease',
      }}>
        {screen === 'splash' && <SplashScreen {...screenProps} />}
        {screen === 'mbti' && <MBTIScreen {...screenProps} />}
        {screen === 'result' && <ResultScreen {...screenProps} />}
        {screen === 'detail' && <DetailScreen {...screenProps} />}
      </div>

                  height: '100%', borderRadius: 2,
                  width: `${f.score}%`,
                  background: `linear-gradient(90deg, ${T.accent}80, ${T.accent})`,
                  transition: 'width 1s ease',
                }}/>
              </div>
            </div>
          ))}
        </div>

        {/* MBTI match section */}
        <div style={{
          background: isGlass ? 'rgba(255,255,255,0.04)' : T.card,
          border: `1px solid ${T.border}`,
          borderRadius: 20, padding: 20, marginBottom: 12,
          backdropFilter: isGlass ? 'blur(20px)' : 'none',
        }}>
          <div style={{
            color: T.accent, fontSize: 12, fontFamily: 'Noto Sans KR',
            fontWeight: 600, letterSpacing: 1, marginBottom: 12,
          }}>
            {lang === 'ko' ? 'MBTI 매칭 이유' : 'WHY THIS MATCH'}
          </div>
          <div style={{
            display: 'flex', alignItems: 'flex-start', gap: 12,
          }}>
            <div style={{
              fontSize: 32, lineHeight: 1,
              minWidth: 44,
            }}>{whisky.emoji}</div>
            <div style={{
              color: T.textDim, fontSize: 13,
              fontFamily: 'Noto Sans KR', lineHeight: 1.7,
            }}>{whisky.desc}</div>
          </div>
        </div>

        {/* How to drink */}
        <div style={{
          background: isGlass ? 'rgba(255,255,255,0.04)' : T.card,
          border: `1px solid ${T.border}`,
          borderRadius: 20, padding: 20, marginBottom: 24,
          backdropFilter: isGlass ? 'blur(20px)' : 'none',
        }}>
          <div style={{
            color: T.accent, fontSize: 12, fontFamily: 'Noto Sans KR',
            fontWeight: 600, letterSpacing: 1, marginBottom: 12,
          }}>
            {lang === 'ko' ? '추천 음용 방법' : 'HOW TO DRINK'}
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {['Neat', 'On the Rocks', 'Splash'].map((method, i) => (
              <div key={method} style={{
                flex: 1, padding: '10px 8px',
                background: i === 1 ? T.accentDim : 'transparent',
                border: `1px solid ${i === 1 ? T.accent : T.border}`,
                borderRadius: 12, textAlign: 'center',
              }}>
                <div style={{ fontSize: 18, marginBottom: 4 }}>
                  {['🥃','🧊','💧'][i]}
                </div>
                <div style={{
                  color: i === 1 ? T.accent : T.textDim,
                  fontSize: 11, fontFamily: 'Noto Sans KR',
                }}>{method}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Retry */}
        <button
          onClick={() => navigate('mbti')}
          style={{
            width: '100%', padding: '17px 0',
            background: T.accent,
            border: 'none', borderRadius: 16,
            color: '#1a0a00',
            fontFamily: 'Noto Sans KR', fontWeight: 600,
            fontSize: 15, cursor: 'pointer',
            boxShadow: `0 8px 24px ${T.accent}40`,
          }}
        >
          {lang === 'ko' ? '다른 MBTI로 찾아보기' : 'Try Another Type'} ↻
        </button>
      </div>
    </div>
  );
}

// ─── Mount ────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);

// ─── Tweaks integration ───────────────────────────────────────
window.addEventListener('message', (e) => {
  if (e.data?.type === '__activate_edit_mode') {
    document.getElementById('tweaks-panel').style.display = 'block';
  }
  if (e.data?.type === '__deactivate_edit_mode') {
    document.getElementById('tweaks-panel').style.display = 'none';
  }
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

</script>
</body>
</html>
