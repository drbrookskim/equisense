<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Network</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050810;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }

  /* Demo overlay — remove if you only want the canvas */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(120,180,255,0.55);
    margin-bottom: 18px;
  }

  .headline {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,0.92);
    text-align: center;
    line-height: 1.15;
  }

  .headline span {
    background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #34d399 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub {
    margin-top: 16px;
    font-size: clamp(0.88rem, 1.5vw, 1.05rem);
    color: rgba(180,200,240,0.45);
    text-align: center;
    max-width: 480px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay">
  <div class="badge">Interactive Particle Network</div>
  <h1 class="headline">Move your<br><span>cursor</span></h1>
  <p class="sub">Particles repel, connect, and breathe — a living mesh reacting to your presence.</p>
</div>

<script>
(() => {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────
  const CFG = {
    COUNT:           Math.min(Math.floor((window.innerWidth * window.innerHeight) / 9000), 220),
    SPEED_MAX:       0.45,       // max base drift speed
    RADIUS:         1.8,         // particle draw radius
    GLOW_RADIUS:    3.5,         // soft glow radius
    LINK_DIST:      140,         // max distance for particle–particle link
    MOUSE_DIST:     160,         // mouse influence radius
    REPEL_STRENGTH: 5.5,         // repulsion force magnitude
    REPEL_EASE:     0.08,        // how quickly velocity corrects
    COLOR_PARTICLE: [160, 200, 255],  // base particle RGB
    COLOR_LINK:     [100, 160, 255],  // base link RGB
    COLOR_MOUSE_LK: [140, 110, 255],  // mouse–particle link RGB
    BG:             '#050810',
    MOUSE_BRIGHT:   1.0,         // link opacity multiplier near mouse
  };

  // ── State ────────────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, particles, mouse = { x: -9999, y: -9999 }, raf;

  // ── Particle class ───────────────────────────────────────────────────────
  class Particle {
    constructor() { this.reset(true); }

    reset(initial = false) {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.vx = (Math.random() - 0.5) * CFG.SPEED_MAX * 2;
      this.vy = (Math.random() - 0.5) * CFG.SPEED_MAX * 2;
      // clamp to min speed
      const spd = Math.hypot(this.vx, this.vy) || 0.1;
      const s   = (0.1 + Math.random() * CFG.SPEED_MAX) / spd;
      this.vx  *= s;
      this.vy  *= s;
      // repulsion velocity accumulator
      this.rx  = 0;
      this.ry  = 0;
      // visual variance
      this.alpha = 0.35 + Math.random() * 0.55;
      this.r     = CFG.RADIUS * (0.7 + Math.random() * 0.6);
      // wobble phase for organic drift
      this.phase  = Math.random() * Math.PI * 2;
      this.wobble = (Math.random() - 0.5) * 0.006;
    }

    update(dt) {
      // organic wobble: slightly rotate velocity vector over time
      this.phase += this.wobble * dt;
      const cos = Math.cos(this.phase * 0.4);
      const sin = Math.sin(this.phase * 0.4);
      const nx  = this.vx * cos - this.vy * sin;
      const ny  = this.vx * sin + this.vy * cos;
      this.vx   = nx;
      this.vy   = ny;

      // mouse repulsion
      const dx   = this.x - mouse.x;
      const dy   = this.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      if (dist < CFG.MOUSE_DIST && dist > 0) {
        const force = (1 - dist / CFG.MOUSE_DIST) * CFG.REPEL_STRENGTH;
        this.rx += (dx / dist) * force;
        this.ry += (dy / dist) * force;
      }

      // apply & decay repulsion
      this.vx += this.rx * CFG.REPEL_EASE;
      this.vy += this.ry * CFG.REPEL_EASE;
      this.rx *= 0.82;
      this.ry *= 0.82;

      // clamp speed
      const spd = Math.hypot(this.vx, this.vy);
      const max = CFG.SPEED_MAX * 2.5;
      if (spd > max) { this.vx = (this.vx / spd) * max; this.vy = (this.vy / spd) * max; }

      this.x += this.vx * (dt / 16);
      this.y += this.vy * (dt / 16);

      // wrap around edges
      if (this.x < -20) this.x = W + 20;
      if (this.x > W + 20) this.x = -20;
      if (this.y < -20) this.y = H + 20;
      if (this.y > H + 20) this.y = -20;
    }

    draw() {
      // soft glow
      const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, CFG.GLOW_RADIUS * this.r);
      const [r, g, b] = CFG.COLOR_PARTICLE;
      grd.addColorStop(0,   `rgba(${r},${g},${b},${this.alpha * 0.9})`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},${this.alpha * 0.3})`);
      grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, CFG.GLOW_RADIUS * this.r, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // solid core
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`;
      ctx.fill();
    }
  }

  // ── Draw link between two points ─────────────────────────────────────────
  function drawLink(x1, y1, x2, y2, opacity, [r, g, b]) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${opacity})`;
    ctx.lineWidth   = opacity * 1.2;
    ctx.stroke();
  }

  // ── Init / Resize ────────────────────────────────────────────────────────
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    // recompute particle count on big resize
    const ideal = Math.min(Math.floor((W * H) / 9000), 220);
    if (!particles || Math.abs(particles.length - ideal) > 20) {
      particles = Array.from({ length: ideal }, () => new Particle());
    }
  }

  // ── Animation loop ───────────────────────────────────────────────────────
  let last = 0;
  function frame(ts) {
    const dt = Math.min(ts - last, 50); // cap delta at 50ms
    last = ts;

    // Clear
    ctx.fillStyle = CFG.BG;
    ctx.fillRect(0, 0, W, H);

    // Update
    for (const p of particles) p.update(dt);

    // Links between particles
    ctx.save();
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a  = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d  = Math.hypot(dx, dy);
        if (d < CFG.LINK_DIST) {
          const op = (1 - d / CFG.LINK_DIST) * 0.22;
          drawLink(a.x, a.y, b.x, b.y, op, CFG.COLOR_LINK);
        }
      }
    }

    // Mouse links
    const mx = mouse.x, my = mouse.y;
    for (const p of particles) {
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < CFG.MOUSE_DIST) {
        const op = (1 - d / CFG.MOUSE_DIST) * CFG.MOUSE_BRIGHT;
        drawLink(p.x, p.y, mx, my, op * 0.55, CFG.COLOR_MOUSE_LK);
      }
    }
    ctx.restore();

    // Draw particles on top
    for (const p of particles) p.draw();

    // Subtle mouse cursor glow
    if (mouse.x > 0) {
      const mg = ctx.createRadialGradient(mx, my, 0, mx, my, CFG.MOUSE_DIST * 0.6);
      mg.addColorStop(0,   'rgba(110, 80, 220, 0.06)');
      mg.addColorStop(1,   'rgba(110, 80, 220, 0)');
      ctx.beginPath();
      ctx.arc(mx, my, CFG.MOUSE_DIST * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = mg;
      ctx.fill();
    }

    raf = requestAnimationFrame(frame);
  }

  // ── Events ───────────────────────────────────────────────────────────────
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', ()  => { mouse.x = -9999; mouse.y = -9999; });

  // touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  // ── Boot ─────────────────────────────────────────────────────────────────
  resize();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
