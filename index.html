      ${mrow('구름 위치', ichi.aboveCloud?'구름 위 (강세)':ichi.belowCloud?'구름 아래 (약세)':'구름 안 (중립)', ichi.aboveCloud?'var(--up)':ichi.belowCloud?'var(--down)':'var(--yellow)', TIPS.ichiSignal.title, TIPS.ichiSignal.body)}
    </div>

    <!-- SMC -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--red)"></span>SMC · 스마트머니 ${tip(TIPS.smc.title, TIPS.smc.body)}</div>
      ${mrow('BOS', smc.bos||'없음', smc.bos&&smc.bos.includes('강세')?'var(--green)':smc.bos?'var(--red)':'var(--muted)', TIPS.bos.title, TIPS.bos.body)}
      ${mrow('FVG', smc.fvg||'없음', smc.fvg&&smc.fvg.includes('상승')?'var(--green)':smc.fvg?'var(--red)':'var(--muted)', TIPS.fvg.title, TIPS.fvg.body)}
      ${mrow('Order Block', smc.ob||'없음', smc.ob&&smc.ob.includes('수요')?'var(--green)':smc.ob?'var(--red)':'var(--muted)', TIPS.ob.title, TIPS.ob.body)}
      ${mrow('SMC 시그널', smc.smc_signal>0?'▲ 매수':smc.smc_signal<0?'▼ 매도':'— 중립', smc.smc_signal>0?'var(--up)':smc.smc_signal<0?'var(--down)':'var(--muted)', TIPS.smcSignal.title, TIPS.smcSignal.body)}
    </div>

    <!-- 퀀트 팩터 -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--green)"></span>퀀트 팩터 ${tip(TIPS.quant.title, TIPS.quant.body)}</div>
      ${mrow('팩터 스코어', quant.factor_score.toFixed(3), quant.factor_score>0.3?'var(--up)':quant.factor_score<-0.3?'var(--down)':'var(--yellow)', TIPS.factorScore.title, TIPS.factorScore.body)}
      ${mrow('모멘텀 1M', quant.mom1m!=null?(quant.mom1m>0?'+':'')+quant.mom1m.toFixed(1)+'%':'-', quant.mom1m!=null&&quant.mom1m>0?'var(--up)':quant.mom1m!=null?'var(--down)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('모멘텀 3M', quant.mom3m!=null?(quant.mom3m>0?'+':'')+quant.mom3m.toFixed(1)+'%':'-', quant.mom3m!=null&&quant.mom3m>0?'var(--up)':quant.mom3m!=null?'var(--down)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('모멘텀 6M', quant.mom6m!=null?(quant.mom6m>0?'+':'')+quant.mom6m.toFixed(1)+'%':'-', quant.mom6m!=null&&quant.mom6m>0?'var(--up)':quant.mom6m!=null?'var(--down)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('MA20', quant.above_ma20>0?'위 (강세)':'아래 (약세)', quant.above_ma20>0?'var(--up)':'var(--down)', TIPS.maPos.title, TIPS.maPos.body)}
      ${mrow('MA60', quant.above_ma60>0?'위 (강세)':'아래 (약세)', quant.above_ma60>0?'var(--up)':'var(--down)', TIPS.maPos.title, TIPS.maPos.body)}
      ${mrow('연환산 변동성', quant.vol20!=null?quant.vol20.toFixed(1)+'%':'-', '', TIPS.volatility.title, TIPS.volatility.body)}
    </div>

  </div>

  <!-- ── Row 3: 기술적·기본적 지표 테이블 (2열) ── -->
  <div class="row row-bottom">
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--purple)"></span>기술적 지표</div>
      ${mrow('RSI (14)', I.rsi?.toFixed(1), I.rsi<30?'var(--up)':I.rsi>70?'var(--down)':'', TIPS.rsi.title, TIPS.rsi.body)}
      ${mrow('Stoch %K', I.stochK?.toFixed(1), '', TIPS.stochK.title, TIPS.stochK.body)}
      ${mrow('Stoch %D', I.stochD?.toFixed(1), '', TIPS.stochD.title, TIPS.stochD.body)}
      ${mrow('MACD', I.macd?.toFixed(4), '', TIPS.macd.title, TIPS.macd.body)}
      ${mrow('MACD Hist', I.macdHist?.toFixed(4), I.macdHist>0?'var(--up)':'var(--down)', TIPS.macdHist.title, TIPS.macdHist.body)}
      ${mrow('BB %', I.bbPct!=null?(I.bbPct*100).toFixed(1)+'%':'-', '', TIPS.bbPct.title, TIPS.bbPct.body)}
      ${mrow('ATR', I.atr!=null?fmt(I.atr,isKr):'-', '', TIPS.atr.title, TIPS.atr.body)}
      ${mrow('거래량 비율', I.volRatio!=null?I.volRatio.toFixed(2)+'x':'-', I.volRatio>1?'var(--up)':'var(--down)', TIPS.volRatio.title, TIPS.volRatio.body)}
    </div>
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--yellow)"></span>기본적 지표</div>
      ${mrow('PER', M.per!=null?M.per.toFixed(1)+'x':'-', '', TIPS.per.title, TIPS.per.body)}
      ${mrow('PBR', M.pbr!=null?M.pbr.toFixed(2)+'x':'-', '', TIPS.pbr.title, TIPS.pbr.body)}
      ${mrow('ROE', M.roe!=null?M.roe.toFixed(1)+'%':'-', M.roe>10?'var(--up)':'var(--down)', TIPS.roe.title, TIPS.roe.body)}
      ${mrow('순이익률', M.netMargin!=null?M.netMargin.toFixed(1)+'%':'-', '', TIPS.netMargin.title, TIPS.netMargin.body)}
      ${mrow('매출성장률', M.revGrowth!=null?(M.revGrowth>0?'+':'')+M.revGrowth.toFixed(1)+'%':'-', M.revGrowth>0?'var(--up)':'var(--down)', TIPS.revGrowth.title, TIPS.revGrowth.body)}
      ${mrow('이익성장률', M.earnGrowth!=null?(M.earnGrowth>0?'+':'')+M.earnGrowth.toFixed(1)+'%':'-', M.earnGrowth>0?'var(--up)':'var(--down)', TIPS.earnGrowth.title, TIPS.earnGrowth.body)}
      ${mrow('부채비율', M.debtEq!=null?M.debtEq.toFixed(0)+'%':'-', '', TIPS.debtEq.title, TIPS.debtEq.body)}
      ${mrow('배당수익률', M.divYield!=null?M.divYield.toFixed(2)+'%':'-', '', TIPS.divYield.title, TIPS.divYield.body)}
      ${mrow('내재가치', fmt(fund.intrinsic,isKr)+' '+currency, fund.intrinsic>price?'var(--up)':'var(--down)', TIPS.intrinsic.title, TIPS.intrinsic.body)}
    </div>
  </div>

  <!-- ── Row 4: 차트 (최하단) ── -->
  <div class="card" style="padding:14px 16px;margin-top:0">
    <div class="card-header"><span class="dot" style="background:var(--green)"></span>종가 · Bollinger Band</div>
    <div class="chart-scroll"><div class="chart-container"><canvas id="priceChart"></canvas></div></div>
    <div id="bbEntryPanel" style="margin-top:10px"></div>
    <div class="rsi-macd-grid">
      <div>
        <div class="card-header"><span class="dot" style="background:var(--purple)"></span>RSI (14)</div>
        <div class="chart-scroll"><div class="chart-container-sm"><canvas id="rsiChart"></canvas></div></div>
        <div id="rsiEntryPanel" style="margin-top:8px"></div>
      </div>
      <div>
        <div class="card-header"><span class="dot" style="background:var(--blue)"></span>MACD</div>
        <div class="chart-scroll"><div class="chart-container-sm"><canvas id="macdChart"></canvas></div></div>
        <div id="macdEntryPanel" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <!-- ── Knowledge Graph ── -->
  <div class="card kg-card" style="padding:20px 20px 14px">
    <div class="card-header"><span class="dot" style="background:var(--purple)"></span>Knowledge Graph</div>
    <div class="kg-tabs">
      <button class="kg-tab active" id="kgTabAnalysis" onclick="switchKgTab('analysis')">분석 그래프</button>
      <button class="kg-tab" id="kgTabValuechain" onclick="switchKgTab('valuechain')">밸류체인</button>
    </div>
    <!-- 분석 그래프 탭 -->
    <div class="kg-wrap" id="kgWrap">
      <div class="kg-hint">스크롤: 확대/축소 · 드래그: 이동</div>
      <div class="kg-legend">
        <span><i style="background:var(--up)"></i>상승·매수</span>
        <span><i style="background:var(--down)"></i>하락·매도</span>
        <span><i style="background:var(--yellow)"></i>중립·관망</span>
        <span><i style="background:var(--purple)"></i>중심·카테고리</span>
      </div>
    </div>
    <!-- 밸류체인 탭 -->
    <div class="kg-wrap" id="vcWrap" style="display:none">
      <div class="kg-hint">스크롤: 확대/축소 · 드래그: 이동</div>
      <div class="kg-legend">
        <span><i style="background:var(--purple)"></i>분석 종목</span>
        <span><i style="background:var(--orange)"></i>산업군</span>
        <span><i style="background:var(--blue)"></i>섹터</span>
        <span><i style="background:var(--muted2)"></i>관련 종목</span>
      </div>
    </div>
  </div>
  `;

  // ══════════════════════════════════════════════════════
  // ── 분석 포인트 & 진입점 감지 ──
  // ══════════════════════════════════════════════════════
  // ── [BB] 신호 ──
  const bbBandwidth = closes.map((c,i) =>
    (ind.bbU[i]!=null && ind.sma20[i]) ? (ind.bbU[i]-ind.bbL[i])/ind.sma20[i] : null);
  const bwArr = bbBandwidth.filter(v=>v!=null).sort((a,b)=>a-b);
  const bwQ20 = bwArr[Math.floor(bwArr.length*0.20)] || 0.03;
  const bbSqueeze   = closes.map((c,i) => bbBandwidth[i]!=null && bbBandwidth[i]<=bwQ20 ? ind.sma20[i] : null);
  const bbUpperTouch= closes.map((c,i) => ind.bbU[i]!=null && c>=ind.bbU[i]*0.999 ? c : null);
  const bbLowerTouch= closes.map((c,i) => ind.bbL[i]!=null && c<=ind.bbL[i]*1.001 ? c : null);
  const sma20CrossUp= closes.map((c,i) => i>0&&ind.sma20[i]!=null&&closes[i-1]<ind.sma20[i-1]&&c>=ind.sma20[i] ? c : null);
  const sma20CrossDn= closes.map((c,i) => i>0&&ind.sma20[i]!=null&&closes[i-1]>ind.sma20[i-1]&&c<=ind.sma20[i] ? c : null);
  // 진입점: BB 하단 이탈 후 회복 (매수) / BB 상단 이탈 후 재진입 (매도)
  const bbBuyEntry  = closes.map((c,i) => i>0&&ind.bbL[i]!=null&&closes[i-1]<=ind.bbL[i-1]*1.001&&c>ind.bbL[i]*1.001 ? c : null);
  const bbSellEntry = closes.map((c,i) => i>0&&ind.bbU[i]!=null&&closes[i-1]>=ind.bbU[i-1]*0.999&&c<ind.bbU[i]*0.999 ? c : null);

  // ── [RSI] 신호 ──
  const rsiOB      = ind.rsi.map((r,i) => r!=null&&r>=70&&(i===0||ind.rsi[i-1]<70) ? r : null);
  const rsiOS      = ind.rsi.map((r,i) => r!=null&&r<=30&&(i===0||ind.rsi[i-1]>30) ? r : null);
  const rsi50Up    = ind.rsi.map((r,i) => r!=null&&i>0&&r>=50&&ind.rsi[i-1]<50 ? r : null);
  const rsi50Dn    = ind.rsi.map((r,i) => r!=null&&i>0&&r<=50&&ind.rsi[i-1]>50 ? r : null);
  const rsiDivBull = ind.rsi.map((r,i) => {
    if(r==null||i<5) return null;
    const prevLowIdx = ind.rsi.slice(0,i).reduce((a,v,j)=>v!=null&&v<(ind.rsi[a]||Infinity)?j:a,0);
    return closes[i]<closes[prevLowIdx]&&r>ind.rsi[prevLowIdx] ? r : null;
  });
  // 진입점: 과매도 구간 탈출(매수) / 과매수 구간 탈출(매도)
  const rsiBuyEntry = ind.rsi.map((r,i) => r!=null&&i>0&&r>30&&ind.rsi[i-1]!=null&&ind.rsi[i-1]<=30 ? r : null);
  const rsiSellEntry= ind.rsi.map((r,i) => r!=null&&i>0&&r<70&&ind.rsi[i-1]!=null&&ind.rsi[i-1]>=70 ? r : null);

  // ── [MACD] 신호 ──
  const macdGolden = ind.macdLine.map((m,i) => {
    if(m==null||ind.sigLine[i]==null||i===0) return null;
    return m>ind.sigLine[i]&&ind.macdLine[i-1]<=ind.sigLine[i-1] ? m : null;
  });
  const macdDead   = ind.macdLine.map((m,i) => {
    if(m==null||ind.sigLine[i]==null||i===0) return null;
    return m<ind.sigLine[i]&&ind.macdLine[i-1]>=ind.sigLine[i-1] ? m : null;
  });
  const histCrossUp= ind.hist.map((h,i) => h!=null&&i>0&&ind.hist[i-1]!=null&&h>=0&&ind.hist[i-1]<0 ? h : null);
  const histCrossDn= ind.hist.map((h,i) => h!=null&&i>0&&ind.hist[i-1]!=null&&h<=0&&ind.hist[i-1]>0 ? h : null);
  const histPeak   = ind.hist.map((h,i) => {
    if(h==null||i<1||ind.hist[i-1]==null||ind.hist[i+1]==null) return null;
    const p=ind.hist[i-1],n=ind.hist[i+1];
    return (h>0&&h>p&&h>n)||(h<0&&h<p&&h<n) ? h : null;
  });
  // 진입점: 골든크로스(매수) / 데드크로스(매도)
  const macdBuyEntry = macdGolden;
  const macdSellEntry= macdDead;

  // ══════════════════════════════════════════════════════
  // ── 진입점 설명 패널 렌더링 ──
  // ══════════════════════════════════════════════════════
  function entryRow(side, date, price, reason) {
    const isBuy = side === 'BUY';
    const color = isBuy ? 'var(--up)' : 'var(--down)';
    const icon  = isBuy ? '▲' : '▼';
    const label = isBuy ? '매수 진입' : '매도 준비';
    return `<div style="padding:6px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
        <span style="font-size:0.72rem;color:${color};font-weight:700;white-space:nowrap">${icon} ${label}</span>
        <span style="font-size:0.72rem;color:var(--muted);white-space:nowrap">${date}</span>
        <span style="font-size:0.72rem;color:var(--text2);white-space:nowrap">${price}</span>
      </div>
      <div class="entry-reason">${reason}</div>
    </div>`;
  }
  function renderEntryPanel(elId, rows) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!rows.length) { el.innerHTML = ''; return; }
    el.innerHTML = `<div style="background:var(--card2,#0f1923);border-radius:8px;padding:8px 12px;margin-top:2px">
      <div style="font-size:0.72rem;color:var(--muted);margin-bottom:4px;font-weight:600">📍 진입점 이력 (최근 ${rows.length}건)</div>
      ${rows.join('')}
    </div>`;
  }

  // BB 진입점 수집
  const bbEntries = [];
  closes.forEach((c,i) => {
    if (bbBuyEntry[i]!=null)
      bbEntries.push(entryRow('BUY', labels[i], fmt(c),
        `BB 하단 이탈 후 반등 복귀. 과매도 압력 해소·저점 매수 진입 구간. 손절: BB 하단 재이탈 시`));
    if (bbSellEntry[i]!=null)
      bbEntries.push(entryRow('SELL', labels[i], fmt(c),
        `BB 상단 이탈 후 밴드 내 복귀. 과열 해소·단기 차익실현 구간. 재진입: BB 중심선(MA20) 복귀 시 확인`));
  });

  // RSI 진입점 수집
  const rsiEntries = [];
  ind.rsi.forEach((r,i) => {
    if (rsiBuyEntry[i]!=null)
      rsiEntries.push(entryRow('BUY', labels[i], `RSI ${r?.toFixed(1)}`,
        `RSI 과매도(≤30) 탈출. 매도 세력 소진·반등 모멘텀 시작. 확인: MA20 위 종가 마감 시 강도 높아짐`));
    if (rsiSellEntry[i]!=null)
      rsiEntries.push(entryRow('SELL', labels[i], `RSI ${r?.toFixed(1)}`,
        `RSI 과매수(≥70) 탈출. 매수 세력 피로·단기 고점 형성 가능. 확인: MACD 데드크로스 동반 시 강력 매도 신호`));
  });

  // MACD 진입점 수집
  const macdEntries = [];
  ind.macdLine.forEach((m,i) => {
    if (macdBuyEntry[i]!=null)
      macdEntries.push(entryRow('BUY', labels[i], `MACD ${m?.toFixed(3)}`,
        `골든크로스: MACD선이 시그널선 상향 돌파. 상승 추세 전환 확인. 확인: 히스토그램 양전환 동반 시 강한 매수`));
    if (macdSellEntry[i]!=null)
      macdEntries.push(entryRow('SELL', labels[i], `MACD ${m?.toFixed(3)}`,
        `데드크로스: MACD선이 시그널선 하향 돌파. 하락 추세 전환 확인. 확인: 히스토그램 음전환 동반 시 강한 매도`));
  });

  renderEntryPanel('bbEntryPanel',   bbEntries.slice(-5));
  renderEntryPanel('rsiEntryPanel',  rsiEntries.slice(-4));
  renderEntryPanel('macdEntryPanel', macdEntries.slice(-4));

  // ── Knowledge Graph 렌더링 ──
  renderKnowledgeGraph({ ticker, d, I, M, cs, ew, ichi, smc, quant, price, currency, isKr, changeAmt, companyName });
  renderValueChain({ ticker, companyName, isKr });

  // ══════════════════════════════════════════════════════
  // ── 공통 차트 옵션 ──
  // ══════════════════════════════════════════════════════
  const TICK_SIZE = 11;  // metric-row 0.78rem ≈ 12.5px 에 맞춤
  const LEG_SIZE  = 10;
  const sigTooltip = {
    backgroundColor:'#1e2a40', titleColor:'#94a3b8', bodyColor:'#e2e8f0',
    padding:10, titleFont:{size:11}, bodyFont:{size:11},
    callbacks:{
      label: ctx => {
        const meta = ctx.dataset._signalMeta;
        if (!meta) return ctx.dataset.label ? `${ctx.dataset.label}: ${ctx.formattedValue}` : null;
        if (ctx.parsed.y == null) return null;
        return `${meta}  (${ctx.formattedValue})`;
      }
    }
  };
  const co = {
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}, tooltip: sigTooltip},
    scales:{
      x:{ticks:{color:'#64748b',maxTicksLimit:8,font:{size:TICK_SIZE}},grid:{color:'#1a2235'}},
      y:{ticks:{color:'#64748b',font:{size:TICK_SIZE}},grid:{color:'#1a2235'}}
    }
  };

  // 신호 dataset 헬퍼
  function sigDS(data, color, meta, size=5, shape='circle') {
    return { data, borderColor:color, backgroundColor:color,
             pointRadius: data.map(v=>v!=null?size:0),
             pointHoverRadius: data.map(v=>v!=null?size+3:0),
             pointStyle:shape, borderWidth:1.5, tension:0,
             showLine:false, _signalMeta: meta };
  }
  // 진입점 dataset 헬퍼 (더 크고 테두리 강조)
  function entryDS(data, color, meta, shape='triangle') {
    return { data, borderColor:'#fff', backgroundColor:color,
             pointRadius: data.map(v=>v!=null?9:0),
             pointHoverRadius: data.map(v=>v!=null?12:0),
             pointStyle:shape, borderWidth:1.5, tension:0,
             showLine:false, _signalMeta: meta };
  }
  function mkLegend(items) {
    return { display:true, labels:{ color:'#64748b', font:{size:LEG_SIZE}, padding:10,
      generateLabels:()=>items.map(([text,color,bold])=>({
        text, fillStyle:color, strokeStyle:color, lineWidth:0,
        fontStyle: bold?'bold':'normal'
      }))
    }};
  }

  // ── Bollinger Band 차트 ──
  priceChart = new Chart(document.getElementById('priceChart'), {
    type:'line',
    data:{ labels, datasets:[
      {data:closes,   borderColor:'#e2e8f0', borderWidth:1.5, pointRadius:0, tension:.3},
      {data:ind.sma20,borderColor:'#f59e0b', borderWidth:1,   pointRadius:0, tension:.3},
      {data:ind.bbU,  borderColor:'rgba(148,163,184,.3)', borderDash:[4,4], borderWidth:1, pointRadius:0},
      {data:ind.bbL,  borderColor:'rgba(148,163,184,.3)', borderDash:[4,4], borderWidth:1, pointRadius:0,
       fill:{target:2, above:'rgba(148,163,184,.05)'}},
      {data:closes.map(()=>d.targetPrice), borderColor:'rgba(0,212,170,.5)', borderDash:[6,3], borderWidth:1, pointRadius:0},

      entryDS(bbSellEntry, 'rgba(59,130,246,1)',  '▼ 매도 준비 — BB 상단 이탈 후 재진입: 고점 소진 확인', 'rectRot'),
    ]},
    options:{...co, plugins:{...co.plugins, legend: mkLegend([
      ['▲ 매수진입(BB)',   'rgba(239,68,68,1)',   true],
      ['▼ 매도준비(BB)',   'rgba(59,130,246,1)',  true],
      ['BB 상단터치',      'rgba(239,68,68,0.7)',false],
      ['BB 하단터치',      'rgba(59,130,246,0.7)', false],
      ['BB 스퀴즈',        'rgba(245,158,11,.75)',false],
      ['MA20 상향↑',      'rgba(96,165,250,.75)',false],
      ['MA20 하향↓',      'rgba(249,115,22,.75)',false],
    ])}}
  });

  // ── RSI 차트 ──
  rsiChart = new Chart(document.getElementById('rsiChart'), {
    type:'line',
    data:{ labels, datasets:[
      {data:ind.rsi,             borderColor:'#a78bfa',borderWidth:1.5,pointRadius:0,tension:.3},
      {data:ind.rsi.map(()=>70), borderColor:'rgba(255,75,110,.4)',borderDash:[4,3],borderWidth:1,pointRadius:0},
      {data:ind.rsi.map(()=>30), borderColor:'rgba(59,130,246,.4)', borderDash:[4,3],borderWidth:1,pointRadius:0},
      // 보조 신호
      sigDS(rsiOB,      'rgba(239,68,68,0.7)', 'RSI 과매수 진입(≥70) — 고점 경계'),
      sigDS(rsiOS,      'rgba(59,130,246,0.7)',  'RSI 과매도 진입(≤30) — 저점 반등 후보'),
      sigDS(rsi50Up,    'rgba(96,165,250,0.7)', 'RSI 50 상향돌파 — 강세 모멘텀 전환', 4, 'triangle'),
      sigDS(rsi50Dn,    'rgba(249,115,22,0.7)', 'RSI 50 하향돌파 — 약세 모멘텀 전환', 4, 'triangle'),
      sigDS(rsiDivBull, 'rgba(245,158,11,0.8)', '강세 다이버전스 — 가격↓ RSI↑ 반등 기대', 4, 'star'),
      // 진입점
      entryDS(rsiBuyEntry,  'rgba(239,68,68,1)',  '▲ 매수 진입 — RSI 과매도(30) 탈출: 매도세력 소진·반등 시작'),
      entryDS(rsiSellEntry, 'rgba(59,130,246,1)', '▼ 매도 준비 — RSI 과매수(70) 탈출: 매수세력 피로·조정 시작'),
    ]},
    options:{...co,
      scales:{...co.scales, y:{...co.scales.y,min:0,max:100}},
      plugins:{...co.plugins, legend: mkLegend([
        ['▲ 매수진입(RSI)', 'rgba(239,68,68,1)',   true],
        ['▼ 매도준비(RSI)', 'rgba(255,75,110,1)',  true],
        ['과매수(≥70)',     'rgba(255,75,110,.7)', false],
        ['과매도(≤30)',     'rgba(59,130,246,.7)',  false],
        ['50 상향↑',       'rgba(96,165,250,.7)', false],
        ['강세다이버',      'rgba(245,158,11,.8)', false],
      ])}
    }
  });

  // ── MACD 차트 ──
  macdChart = new Chart(document.getElementById('macdChart'), {
    type:'bar',
    data:{ labels, datasets:[
      {type:'bar',  data:ind.hist, backgroundColor:ind.hist.map(v=>v!=null?(v>=0?'rgba(239,68,68,.5)':'rgba(59,130,246,.5)'):null), borderRadius:1},
      {type:'line', data:ind.macdLine,borderColor:'#60a5fa',borderWidth:1.2,pointRadius:0},
      {type:'line', data:ind.sigLine, borderColor:'#f97316',borderWidth:1.2,pointRadius:0},
      // 보조 신호
      sigDS(histCrossUp,'rgba(96,165,250,0.8)', '히스토그램 양전환 — 상승 모멘텀 발생'),
      sigDS(histCrossDn,'rgba(249,115,22,0.8)', '히스토그램 음전환 — 하락 모멘텀 발생'),
      sigDS(histPeak,   'rgba(245,158,11,0.8)', '히스토그램 피크 — 모멘텀 소진 경고', 4, 'rectRot'),
      // 진입점
      entryDS(macdBuyEntry,  'rgba(239,68,68,1)',  '▲ 매수 진입 — 골든크로스: MACD 상향 돌파, 추세 전환 확인'),
      entryDS(macdSellEntry, 'rgba(255,75,110,1)', '▼ 매도 준비 — 데드크로스: MACD 하향 돌파, 하락 전환 확인'),
    ]},
    options:{...co,
      plugins:{...co.plugins, legend: mkLegend([
        ['▲ 매수진입(골든크로스)', 'rgba(239,68,68,1)',   true],
        ['▼ 매도준비(데드크로스)', 'rgba(255,75,110,1)',  true],
        ['히스토 양전환',          'rgba(96,165,250,.8)', false],
        ['히스토 음전환',          'rgba(249,115,22,.8)', false],
        ['모멘텀 소진',            'rgba(245,158,11,.8)', false],
      ])}
    }
  });
}

// ══════════════════════════════════════════════════════
//  Knowledge Graph
// ══════════════════════════════════════════════════════
function renderKnowledgeGraph({ ticker, d, I, M, cs, ew, ichi, smc, quant, price, currency, isKr, changeAmt, companyName }) {
  const wrap = document.getElementById('kgWrap');
  if (!wrap || typeof d3 === 'undefined') return;

  // 색상 헬퍼
  const SIG = { bull:'var(--up)', bear:'var(--down)', neutral:'var(--yellow)', cat:'var(--purple)', center:'var(--purple)' };
  const sig = v => v > 0.15 ? 'bull' : v < -0.15 ? 'bear' : 'neutral';
  const sigBool = (up) => up ? 'bull' : 'bear';

  // ── 노드·링크 정의 ──
  const nodes = [
    // 중심
    { id:'ticker',   label: ticker, group:'center',  size:28, sig:'center' },

    // 카테고리
    { id:'decision', label:'종합판단',  group:'cat', size:18, sig: d.action==='BUY'?'bull':d.action==='SELL'?'bear':'neutral' },
    { id:'tech',     label:'기술분석',  group:'cat', size:18, sig: sig(d.techScore||0) },
    { id:'fund',     label:'기본분석',  group:'cat', size:18, sig: sig(d.fundScore||0) },
    { id:'adv',      label:'고급분석',  group:'cat', size:18, sig: sig((d.advancedComposite||0)) },
    { id:'price_info', label:'가격정보', group:'cat', size:18, sig: changeAmt>=0?'bull':'bear' },

    // 종합판단 하위
    { id:'action',   label: d.action==='BUY'?'● 매수':d.action==='SELL'?'● 매도':'● 관망',
      group:'leaf', size:13, sig: d.action==='BUY'?'bull':d.action==='SELL'?'bear':'neutral' },
    { id:'confidence', label:`신뢰도 ${(d.confidence*100).toFixed(0)}%`, group:'leaf', size:11, sig:'neutral' },
    { id:'target',   label:`목표가 ${price? (d.targetPrice/price*100-100).toFixed(1)+'%':''}`, group:'leaf', size:11, sig:'bull' },
    { id:'support',  label:`지지선 ${price? (d.stopLoss/price*100-100).toFixed(1)+'%':''}`,   group:'leaf', size:11, sig:'bear' },
    { id:'rr',       label:`RR ${d.rr||'-'}:1`, group:'leaf', size:11, sig: (d.rr||0)>=2?'bull':'neutral' },

    // 기술분석 하위
    { id:'rsi',      label:`RSI ${I.rsi?.toFixed(0)||'-'}`,       group:'leaf', size:11, sig: I.rsi>70?'bear':I.rsi<30?'bull':'neutral' },
    { id:'macd',     label:`MACD ${I.macdHist>0?'↑':'↓'}`,        group:'leaf', size:11, sig: I.macdHist>0?'bull':'bear' },
    { id:'bb',       label:`BB% ${I.bbPct!=null?(I.bbPct*100).toFixed(0):''}%`, group:'leaf', size:11, sig: I.bbPct>1?'bear':I.bbPct<0?'bull':'neutral' },
    { id:'stoch',    label:`Stoch ${I.stochK?.toFixed(0)||'-'}`,  group:'leaf', size:11, sig: I.stochK>80?'bear':I.stochK<20?'bull':'neutral' },
    { id:'vol',      label:`거래량 ${I.volRatio?.toFixed(1)||'-'}x`, group:'leaf', size:11, sig: I.volRatio>1.5?'bull':'neutral' },
    { id:'techscore', label:`기술 ${(d.techScore||0)>=0?'+':''}${(d.techScore||0).toFixed(2)}`, group:'leaf', size:11, sig: sig(d.techScore||0) },

    // 기본분석 하위
    { id:'per',      label:`PER ${M.per?.toFixed(0)||'-'}x`,      group:'leaf', size:11, sig:'neutral' },
    { id:'roe',      label:`ROE ${M.roe?.toFixed(0)||'-'}%`,       group:'leaf', size:11, sig: (M.roe||0)>10?'bull':'bear' },
    { id:'revg',     label:`매출성장 ${M.revGrowth!=null?(M.revGrowth>0?'+':'')+M.revGrowth.toFixed(0)+'%':'-'}`, group:'leaf', size:11, sig: (M.revGrowth||0)>0?'bull':'bear' },
    { id:'intrinsic', label:`내재가치\n${M.per!=null?'기준':''}`,  group:'leaf', size:11, sig: price && d.targetPrice?(d.targetPrice>price?'bull':'bear'):'neutral' },
    { id:'fundscore', label:`기본 ${(d.fundScore||0)>=0?'+':''}${(d.fundScore||0).toFixed(2)}`, group:'leaf', size:11, sig: sig(d.fundScore||0) },

    // 고급분석 하위
    { id:'candle',   label:`캔들 ${cs.cs_signal>0?'▲':cs.cs_signal<0?'▼':'—'}`, group:'leaf', size:11, sig: cs.cs_signal>0?'bull':cs.cs_signal<0?'bear':'neutral' },
    { id:'elliott',  label:`파동 ${ew.ew_signal>0?'▲':ew.ew_signal<0?'▼':'—'}`, group:'leaf', size:11, sig: ew.ew_signal>0?'bull':ew.ew_signal<0?'bear':'neutral' },
    { id:'ichimoku', label:`이치모쿠 ${ichi.ichi_signal>0?'▲':'▼'}`, group:'leaf', size:11, sig: ichi.ichi_signal>0?'bull':'bear' },
    { id:'smc_node', label:`SMC ${smc.smc_signal>0?'▲':smc.smc_signal<0?'▼':'—'}`, group:'leaf', size:11, sig: smc.smc_signal>0?'bull':smc.smc_signal<0?'bear':'neutral' },
    { id:'quant_node', label:`퀀트 ${quant.factor_score?.toFixed(2)||'-'}`, group:'leaf', size:11, sig: sig(quant.factor_score||0) },
    { id:'advscore', label:`고급 ${(d.advancedComposite||0)>=0?'+':''}${(d.advancedComposite||0).toFixed(2)}`, group:'leaf', size:11, sig: sig(d.advancedComposite||0) },

    // 가격정보 하위
    { id:'curprice', label:`${price?.toFixed(2)||'-'} ${currency}`, group:'leaf', size:13, sig: changeAmt>=0?'bull':'bear' },
    { id:'mom1m',    label:`1M ${quant.mom1m!=null?(quant.mom1m>0?'+':'')+quant.mom1m.toFixed(0)+'%':'-'}`, group:'leaf', size:11, sig: (quant.mom1m||0)>0?'bull':'bear' },
    { id:'mom3m',    label:`3M ${quant.mom3m!=null?(quant.mom3m>0?'+':'')+quant.mom3m.toFixed(0)+'%':'-'}`, group:'leaf', size:11, sig: (quant.mom3m||0)>0?'bull':'bear' },
    { id:'ma20',     label:`MA20 ${quant.above_ma20>0?'위':'아래'}`, group:'leaf', size:11, sig: quant.above_ma20>0?'bull':'bear' },
  ];

  const links = [
    // 중심 → 카테고리
    { source:'ticker', target:'decision' },
    { source:'ticker', target:'tech' },
    { source:'ticker', target:'fund' },
    { source:'ticker', target:'adv' },
    { source:'ticker', target:'price_info' },
    // 종합판단
    { source:'decision', target:'action' },
    { source:'decision', target:'confidence' },
    { source:'decision', target:'target' },
    { source:'decision', target:'support' },
    { source:'decision', target:'rr' },
    // 기술
    { source:'tech', target:'rsi' },
    { source:'tech', target:'macd' },
    { source:'tech', target:'bb' },
    { source:'tech', target:'stoch' },
    { source:'tech', target:'vol' },
    { source:'tech', target:'techscore' },
    // 기본
    { source:'fund', target:'per' },
    { source:'fund', target:'roe' },
    { source:'fund', target:'revg' },
    { source:'fund', target:'intrinsic' },
    { source:'fund', target:'fundscore' },
    // 고급
    { source:'adv', target:'candle' },
    { source:'adv', target:'elliott' },
    { source:'adv', target:'ichimoku' },
    { source:'adv', target:'smc_node' },
    { source:'adv', target:'quant_node' },
    { source:'adv', target:'advscore' },
    // 가격
    { source:'price_info', target:'curprice' },
    { source:'price_info', target:'mom1m' },
    { source:'price_info', target:'mom3m' },
    { source:'price_info', target:'ma20' },
    // 크로스 링크 (신호 연결)
    { source:'techscore', target:'action', dashed:true },
    { source:'fundscore', target:'action', dashed:true },
    { source:'advscore',  target:'action', dashed:true },
  ];

  // ── SVG 초기화 ──
  const W = wrap.clientWidth || 780, H = 500;
  d3.select(wrap).select('svg').remove();
  const svg = d3.select(wrap).append('svg')
    .attr('width', W).attr('height', H);

  // 줌/패닝
  const g = svg.append('g');
  // ── 공통 상수 ──
  const GR = 5; // 균일 반지름
  const isDark = !document.documentElement.classList.contains('light');
  const kgBg   = isDark ? '#0f1320' : '#f1f5f9';
  const textCol = isDark ? '#e2e8f0' : '#1e293b';
  const linkCol = isDark ? '#334155' : '#cbd5e1';

  // 그레이 팔레트: 0=가장 좋음(어두움) → 4=레드블랙(나쁨)
  // 다크모드: 라이트모드와 반대 방향 — 좋을수록 밝은 원, 나쁠수록 어두운 원
  const GRAYS = isDark
    ? ['#f1f5f9','#94a3b8','#64748b','#334155','#7f1d1d']
    : ['#1e293b','#334155','#475569','#64748b','#7f1d1d'];

  // 핵심 노드용 radial gradient
  const defs = svg.append('defs');
  const grad = defs.append('radialGradient').attr('id','kg-center-grad')
    .attr('cx','40%').attr('cy','35%').attr('r','60%');
  grad.append('stop').attr('offset','0%').attr('stop-color', isDark ? '#ffffff' : '#ffffff');
  grad.append('stop').attr('offset','100%').attr('stop-color', isDark ? '#818cf8' : '#4f46e5');

  // 신호 → 그레이 인덱스 (center/cat 별도)
  const sigIdx = s => ({ bull:0, cat:1, center:0, neutral:2, bear:4 }[s] ?? 2);

  // 줌 핸들러 (adaptive sizing)
  const applyZoom = (k) => {
    const r  = k < 0.28 ? 2.5 : k < 0.55 ? GR * 0.55 : GR;
    const ta = k < 0.55 ? 0 : 1;
    g.selectAll('.kg-node circle').attr('r', r);
    g.selectAll('.kg-node text').style('opacity', ta);
  };
  svg.call(d3.zoom().scaleExtent([0.1, 3]).on('zoom', e => {
    g.attr('transform', e.transform);
    applyZoom(e.transform.k);
  }));

  // 링크
  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('class','kg-link')
    .attr('stroke', linkCol)
    .attr('stroke-width', d => d.dashed ? 1 : 1.2)
    .attr('stroke-dasharray', d => d.dashed ? '4 3' : null)
    .attr('stroke-opacity', 0.5);

  // 노드 그룹
  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .attr('class','kg-node')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  // 배경 원 (선 가리기)
  node.append('circle').attr('class','bg-c').attr('r', GR).attr('fill', kgBg).attr('stroke','none');

  // 컬러 원 (그레이 스케일, 핵심노드는 그라데이션)
  node.append('circle').attr('class','cl-c').attr('r', GR)
    .attr('fill', d => d.group === 'center' ? 'url(#kg-center-grad)' : GRAYS[sigIdx(d.sig)])
    .attr('stroke','none');

  // 텍스트 — 원 하단
  node.append('text')
    .attr('class','nd-lbl')
    .attr('text-anchor','middle')
    .attr('dy', GR + 11)
    .attr('fill', textCol)
    .attr('font-size', 9)
    .attr('font-weight', '500')
    .each(function(d) {
      const lines = d.label.split('\n');
      if (lines.length === 1) { d3.select(this).text(d.label); }
      else {
        lines.forEach((l,i) => d3.select(this).append('tspan')
          .attr('x',0).attr('dy', i===0 ? 0 : 11).text(l));
      }
    });

  // 시뮬레이션
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(d => {
      const s = nodes.find(n=>n.id===d.source.id||n.id===d.source);
      const t = nodes.find(n=>n.id===d.target.id||n.id===d.target);
      if (s?.group==='center'||t?.group==='center') return 130;
      if (s?.group==='cat'   ||t?.group==='cat')    return 100;
      return 80;
    }).strength(0.6))
    .force('charge', d3.forceManyBody().strength(d => d.group==='center'?-500:d.group==='cat'?-250:-100))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(GR + 18))
    .on('tick', () => {
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
          .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

// ══════════════════════════════════════════════════════
//  Knowledge Graph 탭 전환
// ══════════════════════════════════════════════════════
function switchKgTab(tab) {
  const kgWrap = document.getElementById('kgWrap');
  const vcWrap = document.getElementById('vcWrap');
  const tabA   = document.getElementById('kgTabAnalysis');
  const tabV   = document.getElementById('kgTabValuechain');
  if (!kgWrap || !vcWrap) return;
  if (tab === 'analysis') {
    kgWrap.style.display = '';
    vcWrap.style.display = 'none';
    tabA?.classList.add('active');
    tabV?.classList.remove('active');
  } else {
    kgWrap.style.display = 'none';
    vcWrap.style.display = '';
    tabA?.classList.remove('active');
    tabV?.classList.add('active');
  }
}

function getUsEtfData(ticker) {
  const t = ticker.toUpperCase();
  for (const sec of US_SECTOR_ETF.sectors) {
    if (sec.tickers.includes(t)) return { sectorName: sec.name, etfs: sec.etfs };
  }
  return { sectorName: null, etfs: US_SECTOR_ETF.fallback };
}

// ──────────────────────────────────────────────────────
//  Value Chain 그래프 렌더링
// ──────────────────────────────────────────────────────
function renderValueChain({ ticker, companyName, isKr }) {
  const wrap = document.getElementById('vcWrap');
  if (!wrap || typeof d3 === 'undefined') return;

  // ── 국적 판별 헬퍼 ──
  // 한국 종목: 한글 포함 or .KS/.KQ 접미사
  const hasKorean = s => /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(s);
  const isKrName  = s => hasKorean(s) || /\.(KS|KQ|KP)$/i.test(s);
  // 분석 종목 국적에 따라 섹터 내 종목 필터
  const filterByNation = stocks => stocks.filter(s => isKr ? isKrName(s) : !isKrName(s));

  // ── 검색 키 ──
  const searchKey   = VC_TICKER_MAP[ticker] || companyName || ticker;
  const tickerUpper = ticker.replace(/\.(KS|KQ|KP)$/i,'').toUpperCase();

  const isSelfStock = s =>
    s === searchKey || s === tickerUpper ||
    (companyName && (s === companyName || companyName.includes(s) ||
    (s.length > 2 && companyName.startsWith(s))));

  let matchedIndustry = null, matchedSector = null;
  outer: for (const ind of VALUE_CHAIN_DATA) {
    for (const sec of ind.sectors) {
      if (sec.stocks.some(isSelfStock)) {
        matchedIndustry = ind;
        matchedSector   = sec;
        break outer;
      }
    }
  }

  // ── SVG 초기화 ──
  wrap.querySelectorAll('.vc-info,.vc-nodata').forEach(el => el.remove());
  const W = wrap.clientWidth || 780, H = 500;
  d3.select(wrap).select('svg').remove();
  const svg = d3.select(wrap).append('svg').attr('width', W).attr('height', H);
  const g   = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.25, 3]).on('zoom', e => g.attr('transform', e.transform)));

  const isDark     = !document.documentElement.classList.contains('light');
  const textColor  = isDark ? '#f1f5f9' : '#0f172a';
  const mutedColor = isDark ? '#94a3b8' : '#64748b';
  const clrCenter  = isDark ? '#a78bfa' : '#6d28d9';
  const clrInd     = isDark ? '#f97316' : '#c2410c';
  const clrSec     = isDark ? '#3b82f6' : '#1d4ed8';
  const clrStock   = isDark ? '#475569' : '#94a3b8';
  const clrSelf    = isDark ? '#fbbf24' : '#b45309';

  // relevance 0(낮음)~1(높음) → 그레이 인덱스: 1=어두움(높음), 4=밝음(낮음)
  const relIdx = r => r >= 0.85 ? 0 : r >= 0.65 ? 1 : r >= 0.45 ? 2 : r >= 0.25 ? 3 : 4;

  if (!matchedSector) {
    const nodes = [], links = [];
    const centerLabel = (companyName||ticker).slice(0,14);
    nodes.push({ id:'_center', label: centerLabel, rel:1.0 });

    if (!isKr) {
      // ── 미국 주식: 섹터별 관련 ETF 그래프 ──
      const { sectorName, etfs } = getUsEtfData(ticker);

      if (sectorName) {
        // 섹터 노드
        const secLabel = sectorName.length > 14 ? sectorName.slice(0,14)+'…' : sectorName;
        nodes.push({ id:'_sector', label: secLabel, rel:0.75 });
        links.push({ source:'_center', target:'_sector' });
        etfs.forEach((e, i) => {
          nodes.push({ id:`etf_${i}`, label:`${e.ticker}\n${e.name.slice(0,10)}`, rel: e.rel });
          links.push({ source:'_sector', target:`etf_${i}` });
        });
      } else {
        // 섹터 미매칭: fallback ETF 직접 연결
        etfs.forEach((e, i) => {
          nodes.push({ id:`etf_${i}`, label:`${e.ticker}\n${e.name.slice(0,10)}`, rel: e.rel });
          links.push({ source:'_center', target:`etf_${i}` });
        });
      }

      buildVCGraph(g, W, H, nodes, links, relIdx, isDark);
      const div = document.createElement('div');
      div.className = 'vc-nodata';
      div.style.cssText = 'position:absolute;top:12px;left:16px;font-size:0.72rem;color:var(--muted);pointer-events:none';
      div.innerHTML = `<b style="color:var(--blue)">${companyName||ticker}</b> · ${sectorName || 'US 전체'} 관련 ETF`;
      wrap.appendChild(div);
    } else {
      // ── 한국 주식 미등록: 전체 산업 맵 (기존 동작) ──
      VALUE_CHAIN_DATA.forEach((ind, i) => {
        const indId = `ind_${i}`;
        nodes.push({ id:indId, label: ind.industry.length>13?ind.industry.slice(0,13)+'…':ind.industry, rel:0.5 });
        links.push({ source:'_center', target:indId });
        ind.sectors.forEach((sec, j) => {
          const filtered = filterByNation(sec.stocks);
          if (!filtered.length) return;
          const secId = `sec_${i}_${j}`;
          nodes.push({ id:secId, label: sec.name.length>11?sec.name.slice(0,11)+'…':sec.name, rel:0.3 });
          links.push({ source:indId, target:secId });
          filtered.forEach((s, k) => {
            nodes.push({ id:`st_${i}_${j}_${k}`, label:s, rel:0.15 });
            links.push({ source:secId, target:`st_${i}_${j}_${k}` });
          });
        });
      });
      buildVCGraph(g, W, H, nodes, links, relIdx, isDark);
      const div = document.createElement('div');
      div.className = 'vc-nodata';
      div.style.cssText = 'position:absolute;top:12px;left:16px;font-size:0.72rem;color:var(--muted);pointer-events:none';
      div.textContent = `${companyName||ticker}: 밸류체인 미등록 — 한국 전체 산업 맵`;
      wrap.appendChild(div);
    }
    return;
  }

  // ── 매칭된 경우 ──
  const nodes = [], links = [];
  const displayName = companyName || ticker;

  nodes.push({ id:'_center', label: displayName.length>13?displayName.slice(0,13)+'…':displayName, rel:1.0 });
  nodes.push({ id:'_industry', label: matchedIndustry.industry.length>15?matchedIndustry.industry.slice(0,15)+'…':matchedIndustry.industry, rel:0.7 });
  links.push({ source:'_center', target:'_industry' });

  matchedIndustry.sectors.forEach((sec, si) => {
    const isMain = sec === matchedSector;
    const filtered = filterByNation(sec.stocks);
    if (!filtered.length) return;

    const secId = `_sec_${si}`;
    nodes.push({ id:secId, label: sec.name.length>12?sec.name.slice(0,12)+'…':sec.name, rel: isMain ? 0.65 : 0.3 });
    links.push({ source:'_industry', target:secId });

    filtered.forEach((s, k) => {
      const isSelf = isSelfStock(s);
      const sid = `st_${si}_${k}`;
      nodes.push({ id:sid, label:s, rel: isSelf ? 1.0 : isMain ? 0.45 : 0.15, isSelf });
      links.push({ source:secId, target:sid });
      if (isSelf) links.push({ source:'_center', target:sid, dashed:true });
    });
  });

  buildVCGraph(g, W, H, nodes, links, relIdx, isDark);

  const div = document.createElement('div');
  div.className = 'vc-info';
  div.style.cssText = 'position:absolute;top:12px;left:16px;font-size:0.72rem;color:var(--muted);pointer-events:none';
  div.innerHTML = `<b style="color:var(--orange)">${matchedIndustry.industry}</b> &rsaquo; <b style="color:var(--blue)">${matchedSector.name}</b>`;
  wrap.appendChild(div);
}

function buildVCGraph(g, W, H, nodes, links, relIdx, isDark) {
  const VR     = 5; // 균일 반지름
  const vcBg   = isDark ? '#0f1320' : '#f1f5f9';
  const textCol = isDark ? '#e2e8f0' : '#1e293b';
  const linkCol = isDark ? '#334155' : '#cbd5e1';
  // 다크모드: 좋을수록 밝은 원(라이트모드와 반대 방향)
  const GRAYS  = isDark
    ? ['#f1f5f9','#94a3b8','#64748b','#334155','#7f1d1d']
    : ['#1e293b','#334155','#475569','#64748b','#7f1d1d'];

  // 핵심 노드용 radial gradient (VC)
  const svgForDefs = g.node().closest('svg');
  if (svgForDefs && !svgForDefs.querySelector('#vc-center-grad')) {
    const defs = d3.select(svgForDefs).append('defs');
    const grad = defs.append('radialGradient').attr('id','vc-center-grad')
      .attr('cx','40%').attr('cy','35%').attr('r','60%');
    grad.append('stop').attr('offset','0%').attr('stop-color', '#ffffff');
    grad.append('stop').attr('offset','100%').attr('stop-color', isDark ? '#818cf8' : '#4f46e5');
  }

  const applyZoom = k => {
    const r  = k < 0.28 ? 2.5 : k < 0.55 ? VR * 0.55 : VR;
    const ta = k < 0.55 ? 0 : 1;
    g.selectAll('.kg-node circle').attr('r', r);
    g.selectAll('.kg-node text').style('opacity', ta);
  };

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('class','kg-link')
    .attr('stroke', linkCol)
    .attr('stroke-width', d => d.dashed ? 1 : 1.2)
    .attr('stroke-dasharray', d => d.dashed ? '4 3' : null)
    .attr('stroke-opacity', 0.5);

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .attr('class','kg-node')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  // 배경 원
  node.append('circle').attr('class','bg-c').attr('r', VR).attr('fill', vcBg).attr('stroke','none');

  // 관련도 기반 그레이 원 (최고 관련 노드는 그라데이션)
  node.append('circle').attr('class','cl-c').attr('r', VR)
    .attr('fill', d => (d.rel ?? 0) >= 1.0 ? 'url(#vc-center-grad)' : GRAYS[relIdx(d.rel ?? 0.3)])
    .attr('stroke','none');

  // 텍스트 — 원 하단
  node.append('text')
    .attr('class','nd-lbl')
    .attr('text-anchor','middle')
    .attr('dy', VR + 11)
    .attr('fill', textCol)
    .attr('font-size', 9)
    .attr('font-weight', '500')
    .text(d => d.label);

  // zoom 핸들러는 svg에 등록된 것을 재활용 (wrap의 svg)
  const svgEl = g.node().closest('svg');
  if (svgEl) {
    const zoom = d3.zoom().scaleExtent([0.1, 3]).on('zoom', e => {
      g.attr('transform', e.transform);
      applyZoom(e.transform.k);
    });
    d3.select(svgEl).call(zoom);
  }

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(d => {
      const src = nodes.find(n=>n.id===(d.source.id??d.source));
      const r0 = src?.rel ?? 0.5;
      return r0 >= 0.8 ? 120 : r0 >= 0.5 ? 95 : 72;
    }).strength(0.5))
    .force('charge', d3.forceManyBody().strength(d =>
      (d.rel??0) >= 0.9 ? -480 : (d.rel??0) >= 0.6 ? -240 : (d.rel??0) >= 0.4 ? -140 : -75))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(VR + 18))
    .on('tick', () => {
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
          .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

function krDictSearch(q) {
  const key = q.trim().toLowerCase();
  if (!key) return [];

  const seen = new Set();
  const results = [];

  // 유효한 티커 보유 항목만 검색
  const valid = KR_STOCKS.filter(([,sym]) => sym && sym.includes('.'));

  // 우선순위: 0=정확일치, 1=앞부터일치, 2=포함
  const scored = [];
  for (const [name, sym, market] of valid) {
    const n = name.toLowerCase();
    let score = -1;
    if (n === key)            score = 0;
    else if (n.startsWith(key)) score = 1;
    else if (n.includes(key)) score = 2;
    if (score >= 0) scored.push({ score, name, sym, market: market || 'KRX' });
  }

  scored.sort((a, b) => a.score - b.score || a.name.length - b.name.length);

  for (const { name, sym, market } of scored) {
    if (seen.has(sym)) continue;
    seen.add(sym);
    results.push({ symbol: sym, longname: name, exchDisp: market });
  }
  return results;
}

function enDictSearch(q) {
  const key = q.trim().toLowerCase();
  if (EN_DICT[key]) return [{ symbol: EN_DICT[key], longname: q, exchDisp: 'NYSE/NASDAQ' }];
  const matches = Object.entries(EN_DICT)
    .filter(([name]) => name.includes(key) || key.includes(name))
    .map(([name, sym]) => ({ symbol: sym, longname: name, exchDisp: 'NYSE/NASDAQ' }));
  return matches;
}

// CORS 프록시 목록 (순차 시도)
const PROXIES = [
  'https://corsproxy.io/?url=',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.org/?',
];

async function fetchWithProxy(url, signal) {
  for (const proxy of PROXIES) {
    try {
      const resp = await fetch(proxy + encodeURIComponent(url), signal ? { signal } : {});
      if (resp.ok) return resp;
    } catch (e) {
      if (e?.name === 'AbortError') throw e;  // 타임아웃은 즉시 중단
    }
  }
  throw new Error('모든 프록시 실패');
}

async function searchTickers(q) {
  const isKorean = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(q);

  // 1) 내장 한국 사전
  const dictHits = krDictSearch(q);
  // 2) 내장 영어 사전
  const enHits = enDictSearch(q);

  // 한글 검색: 로컬 사전 결과 즉시 반환 (API 대기 없음)
  if (isKorean) {
    const seen = new Set();
    return [...dictHits, ...enHits].filter(r => {
      if (seen.has(r.symbol)) return false;
      seen.add(r.symbol); return true;
    });
  }

  // 영문 검색: Yahoo Finance API (3초 타임아웃)
  const searchUrl = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0&enableFuzzyQuery=true`;
  let apiHits = [];
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000);
    const resp = await fetchWithProxy(searchUrl, ctrl.signal);
    clearTimeout(timer);
    const json = await resp.json();
    apiHits = (json.quotes || []).filter(r => r.symbol && r.quoteType !== 'OPTION');
  } catch { /* API 실패·타임아웃 시 사전 결과만 사용 */ }

  // 합치기 (중복 제거)
  const seen = new Set();
  return [...dictHits, ...enHits, ...apiHits].filter(r => {
    if (seen.has(r.symbol)) return false;
    seen.add(r.symbol); return true;
  });
}

function showAC(items) {
  const list = document.getElementById('ac-list');
  acIdx = -1;
  if (!items.length) { list.style.display = 'none'; return; }

  list.innerHTML = items.map((r, i) => {
    const isKr = r.exchange?.startsWith('KO') || r.symbol?.endsWith('.KS') || r.symbol?.endsWith('.KQ');
    const exchFlag = isKr ? '🇰🇷' : '🇺🇸';
    const exchLabel = r.exchDisp || r.exchange || '';
    const name = r.longname || r.shortname || r.symbol;
    // KOSPI/KOSDAQ 배지 색상
    const badgeColor = exchLabel === 'KOSPI' ? '#3b82f6' : exchLabel === 'KOSDAQ' ? '#a78bfa' : '#64748b';
    return `<div class="ac-item" data-sym="${r.symbol}" data-idx="${i}"
      onmousedown="pickAC('${r.symbol}')">
      <span class="ac-ticker">${r.symbol}</span>
      <span class="ac-name">${name}</span>
      <span class="ac-exch">${exchFlag} <span style="color:${badgeColor};font-weight:600">${exchLabel}</span></span>
    </div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAC() { document.getElementById('ac-list').style.display = 'none'; acIdx = -1; }

function pickAC(sym) {
  document.getElementById('ticker-input').value = sym;
  hideAC();
  runAnalysis();
}

function moveAC(dir) {
  const list = document.getElementById('ac-list');
  const items = list.querySelectorAll('.ac-item');
  if (!items.length) return;
  items[acIdx]?.classList.remove('ac-active');
  acIdx = (acIdx + dir + items.length) % items.length;
  items[acIdx].classList.add('ac-active');
  document.getElementById('ticker-input').value = items[acIdx].dataset.sym;
}

const tickerInput = document.getElementById('ticker-input');

tickerInput.addEventListener('input', () => {
  clearTimeout(acTimer);
  const q = tickerInput.value.trim();
  if (q.length < 1) { hideAC(); return; }
  document.getElementById('ac-list').innerHTML = '<div class="ac-loading">검색 중…</div>';
  document.getElementById('ac-list').style.display = 'block';
  acTimer = setTimeout(async () => {
    try {
      const results = await searchTickers(q);
      showAC(results);
    } catch { hideAC(); }
  }, 300);
});

tickerInput.addEventListener('keydown', e => {
  const list = document.getElementById('ac-list');
  if (list.style.display !== 'none') {
    if (e.key === 'ArrowDown')  { e.preventDefault(); moveAC(1);  return; }
    if (e.key === 'ArrowUp')    { e.preventDefault(); moveAC(-1); return; }
    if (e.key === 'Escape')     { hideAC(); return; }
    if (e.key === 'Enter' && acIdx >= 0) { e.preventDefault(); pickAC(list.querySelectorAll('.ac-item')[acIdx].dataset.sym); return; }
  }
  if (e.key === 'Enter') runAnalysis();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-outer')) hideAC();
});

  const period = document.getElementById('period-select').value;
  const style  = document.getElementById('style-select').value;
  const ticker = raw ? raw.toUpperCase() : '';

  window.open(url, '_blank');
}

// ── Aurora Blob Background (다크 모드 전용) ──
// ══════════════════════════════════════════════════════
(function initAurora() {
  const canvas = document.getElementById('aurora-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // ── 다크 모드 블롭: 선명한 네온 계열 ──
  const darkBlobs = [
    { x:.18, y:.22, r:.38, color:'rgba(108,92,231,',  vx:.00012, vy:.00008, phase:0   },
    { x:.72, y:.15, r:.32, color:'rgba(0,153,255,',   vx:-.0001, vy:.00013, phase:1.2 },
    { x:.55, y:.72, r:.42, color:'rgba(0,212,170,',   vx:.00009, vy:-.0001, phase:2.4 },
    { x:.10, y:.75, r:.28, color:'rgba(167,139,250,',  vx:.00014, vy:.00006, phase:0.7 },
    { x:.88, y:.58, r:.34, color:'rgba(236,72,153,',   vx:-.0001, vy:-.0001, phase:3.1 },
    { x:.42, y:.42, r:.25, color:'rgba(56,189,248,',   vx:.00007, vy:.00015, phase:1.8 },
  ];

  // ── 라이트 모드 블롭: 파스텔 소프트 계열 ──
  // Pale Glow(#F8F1EE) · Ghostly Sky(#ECF8F8) · Linen Noon(#FCFAF2) 팔레트 기반
  const lightBlobs = [
    { x:.20, y:.18, r:.40, color:'rgba(255,182,159,',  vx:.00010, vy:.00007, phase:0   }, // 피치 코랄
    { x:.75, y:.20, r:.35, color:'rgba(129,236,236,',  vx:-.0009, vy:.00012, phase:1.4 }, // 민트 스카이
    { x:.50, y:.68, r:.44, color:'rgba(253,242,180,',  vx:.00008, vy:-.0009, phase:2.6 }, // 레몬 노랑
    { x:.12, y:.70, r:.30, color:'rgba(210,196,255,',  vx:.00013, vy:.00006, phase:0.9 }, // 라벤더
    { x:.85, y:.55, r:.32, color:'rgba(255,214,214,',  vx:-.0008, vy:-.0008, phase:3.3 }, // 로즈 핑크
    { x:.40, y:.38, r:.28, color:'rgba(180,235,220,',  vx:.00006, vy:.00014, phase:2.0 }, // 세이지 민트
  ];

  let W, H, t = 0, running = false;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function isDark() { return !document.documentElement.classList.contains('light'); }

  function draw() {
    canvas.style.visibility = 'visible';
    running = true;
    ctx.clearRect(0, 0, W, H);

    const dark = isDark();

    // ── 배경 기본색 ──
    // 다크: 160deg (좌하→우상), 라이트: 160deg 동일
    const angle = 160 * Math.PI / 180;
    const L = Math.sqrt(W * W + H * H);
    const cx = W / 2, cy = H / 2;
    const x0 = cx - Math.cos(angle) * L / 2;
    const y0 = cy - Math.sin(angle) * L / 2;
    const x1 = cx + Math.cos(angle) * L / 2;
    const y1 = cy + Math.sin(angle) * L / 2;
    const bg = ctx.createLinearGradient(x0, y0, x1, y1);
    if (dark) {
      bg.addColorStop(0, '#141821');
      bg.addColorStop(1, '#1F1762');
    } else {
      bg.addColorStop(0,   '#F8F1EE');  // Pale Glow — Bone Peach
      bg.addColorStop(0.5, '#ECF8F8');  // Ghostly Sky — Glacial White
      bg.addColorStop(1,   '#FCFAF2');  // Linen Noon — Paper Yellow
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ── 블롭 렌더링 ──
    const blobs = dark ? darkBlobs : lightBlobs;
    // 다크: 중심 0.30 투명도 / 라이트: 중심 0.45 투명도 (밝은 배경에서 잘 보이도록)
    const coreAlpha = dark ? 0.30 : 0.50;
    const midAlpha  = dark ? 0.13 : 0.22;

    for (const b of blobs) {
      const pulse = 1 + 0.06 * Math.sin(t * 0.0008 + b.phase);
      const bx = (b.x + Math.sin(t * b.vx + b.phase) * 0.18) * W;
      const by = (b.y + Math.cos(t * b.vy + b.phase) * 0.15) * H;
      const br = b.r * Math.min(W, H) * pulse;

      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      grad.addColorStop(0,   b.color + coreAlpha + ')');
      grad.addColorStop(0.4, b.color + midAlpha  + ')');
      grad.addColorStop(1,   b.color + '0)');

      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // ── 오버레이 ──
    // 다크: 어두운 필름으로 가독성 확보 / 라이트: 밝은 화이트 베일로 부드럽게
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.28)';
    ctx.fillRect(0, 0, W, H);

    t++;
    requestAnimationFrame(draw);
  }

  // 테마 변경 시 재시작 (html 태그의 class 감시)
  new MutationObserver(() => {
    if (!running) requestAnimationFrame(draw);
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  // 최초 실행
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
