<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Today's Stock Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* ── 다크 모드 (기본) ── */
  :root {
    --bg:        #0a0e1a;
    --card:      #111827;
    --card2:     #0f1320;
    --border:    #1e2a40;
    --border2:   #2d3f5a;
    --text:      #f1f5f9;        /* 거의 흰색 — 주요 텍스트 */
    --text2:     #e2e8f0;        /* 밝은 회색 — 보조 텍스트 */
    --muted:     #94a3b8;        /* 중간 회색 — 레이블 (기존 #64748b보다 밝게) */
    --muted2:    #64748b;        /* 어두운 회색 — 힌트·구분선 */
    --topbar:    rgba(17,24,39,0.95);
    --metric-bd: #1a2235;
    --green:     #00d4aa;
    --red:       #ff4b6e;
    --yellow:    #fbbf24;
    --blue:      #3b82f6;
    --purple:    #a78bfa;
    --orange:    #f97316;
    --shadow:    rgba(0,0,0,.4);
  }
  /* ── 라이트 모드 ── */
  html.light {
    --bg:        #f0f4f8;
    --card:      #ffffff;
    --card2:     #f1f5f9;
    --border:    #cbd5e1;
    --border2:   #94a3b8;
    --text:      #0f172a;        /* 거의 검정 — 주요 텍스트 */
    --text2:     #1e293b;        /* 짙은 네이비 — 보조 텍스트 */
    --muted:     #334155;        /* 짙은 회색 — 레이블 (기존 #64748b보다 어둡게) */
    --muted2:    #64748b;        /* 중간 회색 — 힌트·구분선 */
    --topbar:    rgba(255,255,255,0.95);
    --metric-bd: #e2eaf4;
    --green:     #047857;
    --red:       #be123c;
    --yellow:    #b45309;
    --blue:      #1d4ed8;
    --purple:    #6d28d9;
    --orange:    #c2410c;
    --shadow:    rgba(0,0,0,.12);
  }
  html { font-size: 16.8px; } /* 24px × 0.7 = 16.8px */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'SF Pro Display', -apple-system, sans-serif;
    min-height: 100vh;
    transition: background .25s, color .25s;
  }
  .topbar {
    background: var(--topbar);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--green); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .pill {
    background: var(--border);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.72rem;
    color: var(--text2);
  }
  .btn-gh {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-gh:hover { opacity: 0.85; }
  .btn-theme {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    transition: background .15s, border-color .15s;
  }
  .btn-theme:hover { border-color: var(--blue); }
  .search-wrap {
    max-width: 1300px;
    margin: 32px auto 24px;
    padding: 0 20px;
    display: flex;
    gap: 10px;
  }
  .search-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .2s, background .25s;
  }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--muted); }
  .select-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
    transition: background .25s;
  }
  .btn-run {
    background: var(--green);
    color: #0a0e1a;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .btn-run:hover { opacity: 0.85; }
  .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }
  /* ── 즐겨찾기 ── */
  .fav-section {
    max-width: 1300px;
    margin: 0 auto 24px;
    padding: 0 20px;
  }
  .fav-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
  }
  .fav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .fav-title {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fav-toggle {
    font-size: 0.7rem;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s;
  }
  .fav-toggle:hover { color: var(--text); }
  .fav-group { margin-bottom: 10px; }
  .fav-group:last-child { margin-bottom: 0; }
  .fav-group-label {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: .04em;
  }
  .fav-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 6px;
  }
  .fav-tile {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    min-width: 0;
  }
  .fav-tile:hover { background: var(--border); color: var(--text); border-color: var(--blue); }
  .fav-tile.active { background: var(--border); color: var(--text); border-color: var(--blue); }
  .fav-tile-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fav-tile .tile-del {
    font-size: 0.65rem;
    color: var(--muted);
    line-height: 1;
    flex-shrink: 0;
    transition: color .12s;
  }
  .fav-tile .tile-del:hover { color: var(--red); }
  .fav-add-btn {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .fav-add-btn:hover { border-color: var(--green); color: var(--green); }

  /* 분석 결과 즐겨찾기 버튼 */
  .btn-fav {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-fav:hover { border-color: var(--yellow); color: var(--yellow); }
  .btn-fav.starred { border-color: var(--yellow); color: var(--yellow); background: rgba(251,191,36,.08); }

  /* (구) chip 클래스 — 호환성 유지 */
  .chip-label { font-size: 0.65rem; color: var(--muted); }

  /* ── 검색 기록 ── */
  .history-wrap {
    max-width: 1300px;
    margin: -16px auto 20px;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    min-height: 0;
  }
  .history-label { font-size: 0.65rem; color: var(--muted); white-space: nowrap; }
  .history-chip {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.76rem;
    color: var(--text2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .history-chip:hover { background: var(--border); color: var(--text); border-color: var(--blue); }
  .history-chip .del {
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1;
    padding: 0 1px;
  }
  .history-chip .del:hover { color: var(--red); }
  .history-clear {
    font-size: 0.68rem;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: all .15s;
  }
  .history-clear:hover { color: var(--red); border-color: rgba(255,75,110,.3); }
  .grid { max-width: 1300px; margin: 0 auto; padding: 0 20px 40px; }
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row-top    { grid-template-columns: 260px 1fr 240px; }
  .row-bottom { grid-template-columns: 1fr 280px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .card-header {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 라이트 모드 card-header 가독성 보완 */
  html.light .card-header { color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .badge.buy  { background: rgba(0,212,170,.12); color: var(--green); border: 1px solid rgba(0,212,170,.3); }
  .badge.sell { background: rgba(255,75,110,.12); color: var(--red);   border: 1px solid rgba(255,75,110,.3); }
  .badge.hold { background: rgba(251,191,36,.12); color: var(--yellow);border: 1px solid rgba(251,191,36,.3); }
  .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; font-weight: 600; }
  .big-num { font-size: 1.9rem; font-weight: 700; color: var(--text); line-height: 1.1; }
  .num-sm  { font-size: 1.35rem; font-weight: 700; color: var(--text); }
  .delta-up   { color: var(--green); font-size: 0.78rem; font-weight: 600; }
  .delta-down { color: var(--red);   font-size: 0.78rem; font-weight: 600; }
  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--metric-bd);
    font-size: 0.83rem;
    color: var(--muted);
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-val { color: var(--text); font-weight: 600; }
  .progress-wrap { background: var(--border); border-radius: 4px; height: 6px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 6px; border-radius: 4px; }
  .mini-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .mini-card { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .reason-row { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--metric-bd); font-size: 0.83rem; color: var(--text2); }
  .reason-row:last-child { border-bottom: none; }
  .center-msg { text-align: center; padding: 80px 20px; color: var(--muted); }
  .center-msg .icon { font-size: 2.4rem; margin-bottom: 12px; }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sector-pill { background: var(--border); border-radius: 20px; padding: 2px 10px; font-size: 0.68rem; color: var(--text2); }

  /* ── 검색 자동완성 ── */
  .search-outer { flex: 1; position: relative; }
  .autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    z-index: 200;
    overflow: hidden;
    box-shadow: 0 8px 24px var(--shadow);
    max-height: 320px;
    overflow-y: auto;
  }
  .ac-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background .12s;
    border-bottom: 1px solid var(--metric-bd);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.ac-active { background: var(--border); }
  .ac-ticker { font-size: 0.88rem; font-weight: 700; color: var(--green); min-width: 90px; }
  .ac-name   { font-size: 0.82rem; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-exch   { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .ac-loading { padding: 12px 14px; font-size: 0.82rem; color: var(--muted); text-align: center; }
  .chart-container { position: relative; height: 340px; }
  .chart-container-sm { position: relative; height: 120px; }
  /* ── 말풍선 아이콘 ── */
  .tip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    background: none;
    font-size: 0.82rem;
    cursor: pointer;
    position: relative;
    margin-left: 4px;
    flex-shrink: 0;
    vertical-align: middle;
    line-height: 1;
    user-select: none;
    opacity: 0.65;
    transition: opacity .15s;
  }
  .tip:hover { opacity: 1; }
  .metric-row { align-items: flex-start; }
  .metric-row > span:first-child { display: flex; align-items: center; flex-wrap: wrap; }
  /* ── 설명 모달 ── */
  .tip-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 9000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .tip-modal-overlay.open { display: flex; }
  .tip-modal {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 28px 28px 24px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    position: relative;
    animation: modalIn .18s ease;
  }
  @keyframes modalIn {
    from { opacity:0; transform:scale(.94) translateY(8px); }
    to   { opacity:1; transform:scale(1)   translateY(0); }
  }
  .tip-modal-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    padding-right: 28px;
    line-height: 1.4;
  }
  .tip-modal-body {
    font-size: 0.82rem;
    color: var(--text2);
    line-height: 1.72;
    white-space: pre-line;
  }
  .tip-modal-body b { color: var(--text); font-weight: 600; }
  .tip-modal-body .tag-buy  { color: var(--green); font-weight: 600; }
  .tip-modal-body .tag-sell { color: var(--red);   font-weight: 600; }
  .tip-modal-body .tag-warn { color: var(--yellow); font-weight: 600; }
  .tip-modal-close {
    position: absolute;
    top: 14px; right: 16px;
    background: var(--border);
    border: 1px solid var(--border2);
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--muted);
    transition: background .15s, color .15s;
    flex-shrink: 0;
  }
  .tip-modal-close:hover { background: var(--red); color: #fff; border-color: var(--red); }
  /* ── 고급 분석 6열 그리드 ── */
  .adv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 1100px) { .adv-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px)  { .adv-grid { grid-template-columns: 1fr; } }
  .footer {
    border-top: 1px solid var(--border);
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: var(--muted2, var(--muted));
  }
  .footer a { color: var(--green); text-decoration: none; }
  @media (max-width: 900px) {
    .row-top    { grid-template-columns: 1fr; }
    .row-bottom { grid-template-columns: 1fr; }
    .mini-row   { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .search-wrap { flex-wrap: wrap; }
    .select-box  { width: 100%; }
    .btn-run     { width: 100%; }
  }
</style>
</head>
<body>

<!-- 설명 모달 -->
<div class="tip-modal-overlay" id="tipModalOverlay" onclick="closeTipModal(event)">
  <div class="tip-modal" id="tipModal">
    <button class="tip-modal-close" onclick="closeTipModal()">✕</button>
    <div class="tip-modal-title" id="tipModalTitle"></div>
    <div class="tip-modal-body"  id="tipModalBody"></div>
  </div>
</div>

<header class="topbar">
  <div class="logo">📈 <span>Today's</span> Stock Analyzer</div>
  <div class="topbar-right">
    <span class="pill">기술 + 기본 분석 · 서버리스</span>
    <button class="btn-theme" id="theme-btn" onclick="toggleTheme()" title="라이트/다크 전환">🌙</button>
    <a class="btn-gh" href="https://github.com/drbrookskim/todaysstockanalyzer" target="_blank">⭐ GitHub</a>
  </div>
</header>

<div class="search-wrap">
  <div class="search-outer">
    <input id="ticker-input" class="search-input" type="text"
           placeholder="종목명 또는 티커  예) Apple · 삼성전자 · NVDA · 005930.KS"
           value="AAPL" autocomplete="off"/>
    <div id="ac-list" class="autocomplete-list" style="display:none"></div>
  </div>
  <select id="period-select" class="select-box">
    <option value="1mo">1개월</option>
    <option value="3mo">3개월</option>
    <option value="6mo" selected>6개월</option>
    <option value="1y">1년</option>
    <option value="2y">2년</option>
  </select>
  <select id="style-select" class="select-box">
    <option value="balanced" selected>균형</option>
    <option value="short_term">단기</option>
    <option value="long_term">장기</option>
  </select>
  <button class="btn-run" id="run-btn" onclick="runAnalysis()">▶ 분석 시작</button>
</div>

<!-- 검색 기록 -->
<div class="history-wrap" id="history-wrap" style="display:none"></div>

<!-- 즐겨찾기 -->
<div class="fav-section">
  <div class="fav-card" id="fav-card">
    <div class="fav-header">
      <span class="fav-title">⭐ 즐겨찾기</span>
      <button class="fav-toggle" onclick="toggleFav()">접기 ▲</button>
    </div>
    <div id="fav-body">
      <!-- JS로 렌더링 -->
    </div>
  </div>
</div>

<div class="grid" id="dashboard">
  <div class="center-msg" id="welcome-msg">
    <div class="icon">📈</div>
    <div style="font-size:1.3rem;font-weight:700;color:#e2e8f0;margin-bottom:8px;">Today's Stock Analyzer</div>
    <div>종목을 선택하거나 티커를 입력 후 <b style="color:var(--green)">▶ 분석 시작</b>을 누르세요</div>
    <div style="margin-top:16px;font-size:0.8rem;color:var(--muted)">서버 없이 브라우저에서 직접 분석 · Yahoo Finance 실시간 데이터</div>
  </div>
</div>

<footer class="footer">

const THEME_KEY = 'tsa_theme';

function applyTheme(theme) {
  const isLight = theme === 'light';
  document.documentElement.classList.toggle('light', isLight);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = isLight ? '🌞' : '🌙';
  localStorage.setItem(THEME_KEY, theme);
  // 차트 색상 업데이트 (이미 렌더된 차트가 있으면 재렌더는 분석 재실행으로)
}

function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}

// 저장된 테마 복원
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  document.getElementById('ticker-input').value = t;

}

  try {

    if (saved && saved.us && saved.kr) return saved;
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_FAVS)); // deep copy
}

function saveFavs(favs) {
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
}

function isFaved(ticker) {
  const f = loadFavs();
  return [...f.us, ...f.kr].some(x => x.ticker === ticker);
}

function addFav(ticker, name) {
  const f = loadFavs();
  // 중복 방지
  if ([...f.us, ...f.kr].some(x => x.ticker === ticker)) return;
  // 한국 종목 (.KS / .KQ) 는 kr 그룹에, 나머지는 us 그룹에
  const isKrTicker = /\.(KS|KQ)$/i.test(ticker);
  (isKrTicker ? f.kr : f.us).push({ ticker, name: name || ticker });
  saveFavs(f);
  renderFavs();
}

function removeFav(ticker) {
  const f = loadFavs();
  f.us = f.us.filter(x => x.ticker !== ticker);
  f.kr = f.kr.filter(x => x.ticker !== ticker);
  saveFavs(f);
  renderFavs();
  updateFavBtn(ticker);
}

  if (!body) return;

  const tileHtml = (item) => `

function updateFavBtn(ticker) {
  const btn = document.getElementById('fav-btn');
  if (!btn) return;
  const starred = isFaved(ticker);
  btn.className = 'btn-fav' + (starred ? ' starred' : '');
  btn.innerHTML = starred ? '⭐ 즐겨찾기 해제' : '☆ 즐겨찾기 추가';
}

// ── 검색 기록 ──────────────────────────────────────────
const HISTORY_KEY = 'tsa_history';
const HISTORY_MAX = 10;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(ticker, companyName) {
  let list = loadHistory().filter(h => h.ticker !== ticker);
  list.unshift({ ticker, name: companyName || ticker });
  if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  renderHistory();
}

function removeHistory(ticker) {
  const list = loadHistory().filter(h => h.ticker !== ticker);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  renderHistory();
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  const list = loadHistory();
  if (!list.length) { wrap.style.display = 'none'; return; }

  wrap.style.display = 'flex';
  wrap.innerHTML = `
    <span class="history-label">🕐 최근</span>
    ${list.map(h => `
      <span class="history-chip" onclick="setTickerAndRun('${h.ticker}')">
        <span>${h.name !== h.ticker ? h.name + ' <span style=\'color:var(--muted);font-size:0.68rem\'>' + h.ticker + '</span>' : h.ticker}</span>

      </span>
    `).join('')}
    <span class="history-clear" onclick="clearHistory()">전체 삭제</span>
  `;
}

function closeTipModal(e) {

  document.getElementById('tipModalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('tipModalOverlay')?.classList.remove('open'); });

// Store tip content by auto-assigned index to avoid HTML-in-attribute issues
const _tipStore = [];
function tip(title, body) {
  const idx = _tipStore.push({title: title||'', body: body||''}) - 1;
  return `<span class="tip" onclick="openTipModal(_tipStore[${idx}].title,_tipStore[${idx}].body)">💬</span>`;
}
// metric row with optional modal tooltip
function mrow(label, val, color, tipTitle, tipBody) {
  const t = tipTitle ? tip(tipTitle, tipBody||'') : '';
  return `<div class="metric-row"><span>${label}${t}</span><span class="metric-val" style="color:${color||'#cbd5e1'}">${val??'-'}</span></div>`;

    body: `<b>계산 방법</b>\n현재 주가를 주당순자산(BPS)으로 나눈 값입니다. 회사를 지금 청산하면 주주가 돌려받을 수 있는 금액 대비 주가가 몇 배인지를 나타냅니다.\n\nPBR = 주가 / BPS (주당순자산)\n\n<b>해석 기준</b>\n<span class="tag-buy">▲ 1배 미만</span> — 이론상 청산가치보다 낮은 가격. 자산주·저평가 종목에서 나타납니다.\n<span class="tag-warn">◆ 1~2배</span> — 일반적인 가치주 범위.\n<span class="tag-sell">▼ 3배 초과</span> — 시장의 높은 성장 기대 반영. ROE가 뒷받침되지 않으면 고평가 위험.\n\n<b>ROE와의 관계</b>\nROE가 높을수록 높은 PBR이 정당화됩니다.\n적정 PBR ≈ ROE / 요구수익률 (예: ROE 20%, 요구수익률 10% → PBR 2배 적정)`

  roe: {
    title: 'ROE — 자기자본이익률 (Return on Equity)',

  netMargin: {

  debtEq: {

    body: `<b>계산 방법</b>\n총부채를 자기자본으로 나눈 값으로, 외부 자금 의존도를 나타냅니다.\n\n부채비율 = 총부채 / 자기자본 × 100\n\n<b>해석 기준</b>\n<span class="tag-buy">▲ 100% 이하</span> — 재무 건전. 자기자본만으로도 부채 상환 가능.\n<span class="tag-warn">◆ 100~200%</span> — 주의 구간. 업종 평균과 비교 필요.\n<span class="tag-sell">▼ 200% 초과</span> — 위험 신호. 금리 상승 시 이자 부담 급증, 흑자도산 위험.\n\n<b>업종별 특수성</b>\n금융업(은행·보험) : 레버리지 구조상 높은 부채비율이 정상입니다.\n건설업 : 선수금·매입채무 포함으로 상대적으로 높게 나타납니다.\n제조업·IT : 100% 이하가 우량 기업 기준입니다.`

  intrinsic: {

    body: `<b>계산 방법</b>\n이 분석기는 기술점수(tech_score)와 기본점수(fund_score)를 결합해 단순 추정합니다.\n\n내재가치 = 현재가 × (combined_score × 0.3 + 1.0)\n\n<b>해석</b>\n<span class="tag-buy">▲ 내재가치 > 현재가</span> — 현재가가 추정 가치보다 낮아 저평가 신호.\n<span class="tag-sell">▼ 내재가치 < 현재가</span> — 현재가가 추정 가치보다 높아 고평가 신호.\n\n<b>⚠️ 중요 주의사항</b>\n이 내재가치는 DCF(현금흐름할인), DDM(배당할인) 같은 정밀 밸류에이션이 아닌 간이 추정치입니다. 절대적 기준으로 활용하지 마시고, 반드시 다른 밸류에이션 지표와 함께 참고용으로만 사용하세요.`

  csPattern: {
    title: '캔들스틱 패턴 — Candlestick Patterns (15종)',
    body: `<b>개요</b>\n봉차트의 시가·고가·저가·종가 관계로 단기(1~3봉) 매수/매도 심리를 파악합니다.\n\n<b>강세 패턴 (매수 신호)</b>\n• <b>Hammer</b> : 긴 아래꼬리 + 작은 몸통. 낙폭 과대 후 반등 의지.\n• <b>BullishEngulfing</b> : 전날 음봉을 완전히 감싸는 양봉. 강한 매수 전환.\n• <b>MorningStar</b> : 음봉 → 도지 → 양봉. 바닥 형성 신호 (3봉).\n• <b>ThreeWhiteSoldiers</b> : 3연속 양봉 상승. 강한 상승 추세 확인.\n• <b>PiercingLine</b> : 음봉 후 갭하락 시작 후 전봉 중간 이상 회복.\n\n<b>약세 패턴 (매도 신호)</b>\n• <b>ShootingStar</b> : 긴 윗꼬리 + 작은 몸통. 고점 저항 실패.\n• <b>BearishEngulfing</b> : 전날 양봉을 감싸는 음봉. 강한 매도 전환.\n• <b>EveningStar</b> : 양봉 → 도지 → 음봉. 천장 형성 신호 (3봉).\n• <b>ThreeBlackCrows</b> : 3연속 음봉 하락. 강한 하락 추세 확인.\n\n<b>중립 패턴</b>\n• <b>Doji</b> : 시가 ≈ 종가. 매수·매도 균형 상태, 추세 전환 경고.`

  elliott: {
    title: '엘리어트 파동 이론 — Elliott Wave Theory',
    body: `<b>핵심 이론</b>\n주가는 5개의 충격파(상승)와 3개의 조정파(하락), 총 8파 사이클로 반복 움직인다는 이론입니다. (R.N. Elliott, 1938)\n\n<b>5파 구조 (상승 국면)</b>\n1파 → 2파(조정) → 3파(가장 강한 상승) → 4파(조정) → 5파(마지막 상승)\n\n<b>3파 조정 구조</b>\nA파(하락) → B파(반등) → C파(하락 재개)\n\n<b>이 분석기의 감지 로직</b>\n최근 스윙 고점·저점 5개를 추출해 피보나치 되돌림 비율(38.2%~78.6%)을 확인합니다.\n• 5파 완성 감지 → 이후 ABC 조정 예상 (매도 신호)\n• ABC 조정 완료 감지 → 새 상승파 시작 가능성 (매수 신호)\n\n<b>피보나치 수열과의 관계</b>\n황금비율(0.618, 1.618)이 파동 목표가와 되돌림 구간을 결정하는 핵심입니다.`

  ichimoku: {

  smc: {
    title: 'SMC — 스마트머니 컨셉 (Smart Money Concepts)',
    body: `<b>개요</b>\n기관투자자·헤지펀드 등 대형 세력(Smart Money)의 매매 패턴을 분석해 소매 투자자가 따라가는 전략입니다. ICT(Inner Circle Trader) 기법이 대표적입니다.\n\n<b>3가지 핵심 개념</b>\n\n① <b>BOS (Break of Structure)</b>\n이전 스윙 고점(또는 저점)을 돌파하는 시점입니다.\n강세 BOS: 전 고점 상향 돌파 → 상승 추세 전환 또는 지속\n약세 BOS: 전 저점 하향 이탈 → 하락 추세 전환 또는 지속\n\n② <b>FVG (Fair Value Gap)</b>\n3개 연속 봉에서 생기는 가격 공백입니다. 시장이 너무 빠르게 이동해 체결되지 않은 주문이 남아있는 구간으로, 이후 가격이 되돌아오는 경향이 있습니다.\n상승 FVG: 3봉 중 1봉 저가 > 3봉 전 봉 고가\n\n③ <b>Order Block (OB)</b>\n추세 전환 직전의 마지막 봉. 기관이 대량 매수(수요 OB) 또는 매도(공급 OB) 주문을 집행한 가격대로, 이후 강력한 지지·저항으로 작용합니다.`

  quant: {

function fmt(n, isKr) {
  if (n == null || isNaN(n)) return '-';
  return isKr
    ? Math.round(n).toLocaleString('ko-KR')
    : n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function pct(n) {
  if (n == null || isNaN(n)) return '';
  const up = n >= 0;
  return `<span class="${up?'delta-up':'delta-down'}">${up?'↑':'↓'} ${Math.abs(n).toFixed(1)}%</span>`;
}

//  데이터 수집 (Yahoo Finance via CORS Proxy)
// ══════════════════════════════════════════════════════
async function fetchOHLCV(ticker, period) {
  // includePrePost=false 로 정규장 데이터만, 오늘 미완성 봉 포함
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=${period}&includePrePost=false`;
  const resp = await fetchWithProxy(url);
  if (!resp.ok) throw new Error(`가격 데이터 조회 실패 (${resp.status})`);
  const json = await resp.json();
  const result = json.chart?.result?.[0];
  if (!result) throw new Error('데이터 없음 — 티커를 확인하세요 (예: AAPL, 005930.KS)');

  const ts   = result.timestamp || [];
  const q    = result.indicators.quote[0];
  const adj  = result.indicators.adjclose?.[0]?.adjclose;
  const meta = result.meta || {};

  // 오늘 미완성 봉 제거 (close가 null인 마지막 봉)
  const rawBars = ts.map((t, i) => ({
    date:   new Date(t * 1000),
    open:   q.open[i],
    high:   q.high[i],
    low:    q.low[i],
    close:  (adj && adj[i]) ? adj[i] : q.close[i],
    volume: q.volume[i] || 0,
  }));
  const bars = rawBars.filter(b => b.close != null && b.high != null && b.low != null && !isNaN(b.close));

  if (bars.length < 30) throw new Error('데이터 부족 — 기간을 늘리거나 티커를 확인하세요');

  return {
    bars,
    currency:           meta.currency || 'USD',
    regularMarketPrice: meta.regularMarketPrice,           // 최신 실시간 가격
    previousClose:      meta.chartPreviousClose || meta.previousClose,
    marketState:        meta.marketState || 'CLOSED',      // REGULAR / PRE / POST / CLOSED
    dataUpdatedAt:      meta.regularMarketTime             // Unix timestamp
      ? new Date(meta.regularMarketTime * 1000) : new Date(),
  };
}

// ══════════════════════════════════════════════════════
//  기술적 지표 계산
// ══════════════════════════════════════════════════════
function calcEMA(arr, span) {
  const k = 2 / (span + 1);
  const out = new Array(arr.length).fill(null);
  let start = arr.findIndex(v => v != null);
  if (start < 0 || start + span > arr.length) return out;
  let val = arr.slice(start, start + span).reduce((a,b)=>a+b,0) / span;
  out[start + span - 1] = val;
  for (let i = start + span; i < arr.length; i++) {
    if (arr[i] != null) { val = arr[i]*k + val*(1-k); out[i] = val; }
  }
  return out;
}

function computeIndicators(bars) {
  const n = bars.length;
  const C = bars.map(b=>b.close), H = bars.map(b=>b.high), L = bars.map(b=>b.low), V = bars.map(b=>b.volume);

  // MACD
  const ema12 = calcEMA(C, 12), ema26 = calcEMA(C, 26);
  const macdLine = C.map((_,i) => (ema12[i]!=null&&ema26[i]!=null) ? ema12[i]-ema26[i] : null);
  const macdOnlyValid = macdLine.filter(v=>v!=null);
  const sigShort = calcEMA(macdOnlyValid, 9);
  let si=0;
  const sigLine = macdLine.map(v => v!=null ? (sigShort[si++] ?? null) : null);
  const hist = macdLine.map((v,i) => (v!=null&&sigLine[i]!=null) ? v-sigLine[i] : null);

  // RSI (Wilder smoothing)
  const rsi = new Array(n).fill(null);
  if (n > 14) {
    let ag=0, al=0;
    for (let i=1;i<=14;i++) { const d=C[i]-C[i-1]; d>0?ag+=d:al-=d; }
    ag/=14; al/=14;
    rsi[14] = al===0 ? 100 : 100 - 100/(1+ag/al);
    for (let i=15;i<n;i++) {
      const d=C[i]-C[i-1], g=Math.max(d,0), l=Math.max(-d,0);
      ag=(ag*13+g)/14; al=(al*13+l)/14;
      rsi[i] = al===0 ? 100 : 100 - 100/(1+ag/al);
    }
  }

  // Stochastic
  const stochK = new Array(n).fill(null), stochD = new Array(n).fill(null);
  for (let i=13;i<n;i++) {
    const lo=Math.min(...L.slice(i-13,i+1)), hi=Math.max(...H.slice(i-13,i+1));
    stochK[i] = hi===lo ? 50 : 100*(C[i]-lo)/(hi-lo);
  }
  for (let i=15;i<n;i++) {
    if (stochK[i]!=null&&stochK[i-1]!=null&&stochK[i-2]!=null)
      stochD[i]=(stochK[i]+stochK[i-1]+stochK[i-2])/3;
  }

  // Bollinger
  const sma20=new Array(n).fill(null), bbU=new Array(n).fill(null), bbL=new Array(n).fill(null), bbPct=new Array(n).fill(null);
  for (let i=19;i<n;i++) {
    const sl=C.slice(i-19,i+1), m=sl.reduce((a,b)=>a+b,0)/20;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-m)**2,0)/20);
    sma20[i]=m; bbU[i]=m+2*std; bbL[i]=m-2*std;
    bbPct[i]=(bbU[i]-bbL[i])>0?(C[i]-bbL[i])/(bbU[i]-bbL[i]):0.5;
  }

  // ATR
  const atr=new Array(n).fill(null), tr=new Array(n).fill(null);
  for (let i=1;i<n;i++) tr[i]=Math.max(H[i]-L[i], Math.abs(H[i]-C[i-1]), Math.abs(L[i]-C[i-1]));
  if (n>14) {
    let a=tr.slice(1,15).reduce((s,v)=>s+v,0)/14; atr[14]=a;
    for (let i=15;i<n;i++){a=(a*13+tr[i])/14; atr[i]=a;}
  }

  // Volume ratio
  const volRatio=new Array(n).fill(null);
  for (let i=19;i<n;i++){
    const avg=V.slice(i-19,i+1).reduce((a,b)=>a+(b||0),0)/20;
    volRatio[i]=avg>0?(V[i]||0)/avg:1;
  }

  return { C, H, L, V, macdLine, sigLine, hist, rsi, stochK, stochD, sma20, bbU, bbL, bbPct, atr, volRatio };
}

// ══════════════════════════════════════════════════════
//  Layer 2: 캔들스틱 패턴 (15종)
// ══════════════════════════════════════════════════════
function computeCandlestick(bars) {
  const n = bars.length;
  if (n < 3) return { cs_signal: 0, cs_score: 0, patterns: [] };
  const O = bars.map(b=>b.open), H = bars.map(b=>b.high), L = bars.map(b=>b.low), C = bars.map(b=>b.close);
  const body_pct = 0.1, shadow_ratio = 2.0;
  const detectedPatterns = [];

  // Only analyze last 3 bars
  const i = n - 1;
  function body(j) { return Math.abs(C[j]-O[j]); }
  function rng(j)  { return H[j]-L[j] || 1e-9; }
  function upper(j){ return H[j] - Math.max(O[j],C[j]); }
  function lower(j){ return Math.min(O[j],C[j]) - L[j]; }
  function isBull(j){ return C[j] > O[j]; }

  let bullScore = 0, bearScore = 0;

  // Single-candle
  if (body(i)/rng(i) < body_pct) { detectedPatterns.push('Doji'); }
  if (lower(i) > body(i)*shadow_ratio && upper(i) < body(i)*0.3 && isBull(i)) { detectedPatterns.push('Hammer'); bullScore++; }
  if (upper(i) > body(i)*shadow_ratio && lower(i) < body(i)*0.3 && isBull(i)) { detectedPatterns.push('InvertedHammer'); bullScore++; }
  if (upper(i) > body(i)*shadow_ratio && lower(i) < body(i)*0.3 && !isBull(i)) { detectedPatterns.push('ShootingStar'); bearScore++; }

  // Double-candle (i-1, i)
  if (i >= 1) {
    const prevBull = isBull(i-1);
    if (!prevBull && isBull(i) && O[i] < C[i-1] && C[i] > O[i-1]) { detectedPatterns.push('BullishEngulfing'); bullScore+=2; }
    if (prevBull && !isBull(i) && O[i] > C[i-1] && C[i] < O[i-1]) { detectedPatterns.push('BearishEngulfing'); bearScore+=2; }
    if (!prevBull && isBull(i) && O[i] > C[i-1] && C[i] < O[i-1]) { detectedPatterns.push('BullishHarami'); bullScore++; }
    if (prevBull && !isBull(i) && O[i] < C[i-1] && C[i] > O[i-1]) { detectedPatterns.push('BearishHarami'); bearScore++; }
    if (!prevBull && isBull(i) && O[i] < L[i-1] && C[i] > (O[i-1]+C[i-1])/2) { detectedPatterns.push('PiercingLine'); bullScore+=2; }
    if (prevBull && !isBull(i) && O[i] > H[i-1] && C[i] < (O[i-1]+C[i-1])/2) { detectedPatterns.push('DarkCloudCover'); bearScore+=2; }
  }

  // Triple-candle (i-2, i-1, i)
  if (i >= 2) {
    const ppBull = isBull(i-2);
    const pDoji = body(i-1)/rng(i-1) < body_pct;
    if (ppBull && pDoji && isBull(i) && C[i] > (O[i-2]+C[i-2])/2) { detectedPatterns.push('MorningStar'); bullScore+=2; }
    if (!ppBull && pDoji && !isBull(i) && C[i] < (O[i-2]+C[i-2])/2) { detectedPatterns.push('EveningStar'); bearScore+=2; }
    if (isBull(i)&&isBull(i-1)&&isBull(i-2)&&C[i]>C[i-1]&&C[i-1]>C[i-2]) { detectedPatterns.push('ThreeWhiteSoldiers'); bullScore+=2; }
    if (!isBull(i)&&!isBull(i-1)&&!isBull(i-2)&&C[i]<C[i-1]&&C[i-1]<C[i-2]) { detectedPatterns.push('ThreeBlackCrows'); bearScore+=2; }
  }

  const cs_score = bullScore - bearScore;
  const cs_signal = cs_score > 0 ? 1 : cs_score < 0 ? -1 : 0;
  return { cs_signal, cs_score, patterns: detectedPatterns };
}

// ══════════════════════════════════════════════════════
//  Layer 2: 엘리어트 파동 + 피보나치
// ══════════════════════════════════════════════════════
function computeElliottWave(bars) {
  const closes = bars.map(b=>b.close);
  const n = closes.length;
  const sw = Math.max(5, Math.floor(n/20));

  // Detect swing highs/lows
  const highs = [], lows = [];
  for (let i=sw; i<n-sw; i++) {
    const w = closes.slice(i-sw, i+sw+1);
    if (closes[i] === Math.max(...w)) highs.push({ idx:i, val:closes[i] });
    if (closes[i] === Math.min(...w)) lows.push({ idx:i, val:closes[i] });
  }

  // Merge & sort swings
  const swings = [...highs.map(h=>({...h,type:'H'})), ...lows.map(l=>({...l,type:'L'}))]
    .sort((a,b)=>a.idx-b.idx).slice(-10);

  const pivotHigh = Math.max(...closes.slice(-sw*2));
  const pivotLow  = Math.min(...closes.slice(-sw*2));
  const diff = pivotHigh - pivotLow;
  const FIB = [0.236,0.382,0.5,0.618,0.786,1.0,1.272,1.618,2.618];
  const fibLevels = {};
  FIB.forEach(r => { fibLevels[`fib_${r}`] = Math.round(pivotHigh - diff*r); });

  let ew_signal = 0, wave_label = '분석 불충분';
  const entry_zone = {};

  if (swings.length >= 5) {
    const pts = swings.slice(-5).map(s=>s.val);
    const w1 = pts[1]-pts[0], w3 = pts[3]-pts[2];
    const w2r = w1!==0 ? (pts[1]-pts[2])/(pts[1]-pts[0]) : 0;
    const w4r = w3!==0 ? (pts[3]-pts[4])/(pts[3]-pts[2]) : 0;
    const impulseUp = pts[1]>pts[0] && pts[3]>pts[2] && pts[4]<pts[3]
      && w2r>=0.382 && w2r<=0.786 && w4r>=0.236 && w4r<=0.5;
    if (impulseUp) {
      wave_label = '5파 완성 → 조정 예상';
      ew_signal = -1;
      ['fib_0.382','fib_0.5','fib_0.618'].forEach(k => { if(fibLevels[k]) entry_zone[k]=fibLevels[k]; });
    } else if (w2r >= 0.382) {
      wave_label = 'ABC 조정 완료 → 매수 구간';
      ew_signal = 1;
      ['fib_0.5','fib_0.618'].forEach(k => { if(fibLevels[k]) entry_zone[k]=fibLevels[k]; });
    } else {
      wave_label = '파동 진행 중';
    }
  }

  return { ew_signal, wave_label, entry_zone, fib_levels: fibLevels, pivot_high: pivotHigh, pivot_low: pivotLow };
}

// ══════════════════════════════════════════════════════
//  Layer 2: 이치모쿠 균형표
// ══════════════════════════════════════════════════════
function computeIchimoku(bars) {
  const n = bars.length;
  const H = bars.map(b=>b.high), L = bars.map(b=>b.low), C = bars.map(b=>b.close);
  const mid = (arr, len, i) => {
    if (i < len-1) return null;
    const sl = arr.slice(i-len+1, i+1);
    return (Math.max(...sl) + Math.min(...sl)) / 2;
  };
  const disp = 26;
  const tenkan = C.map((_,i)=>mid(H.map((h,j)=>Math.max(h,L[j]?L[j]:h)),9,i) !== null
    ? (()=>{ const sl=bars.slice(Math.max(0,i-8),i+1); return sl.length<9?null:(Math.max(...sl.map(b=>b.high))+Math.min(...sl.map(b=>b.low)))/2; })()
    : null);
  // Simplified: compute at last index only
  const midN = (len) => {
    if (n < len) return null;
    const sl = bars.slice(n-len);
    return (Math.max(...sl.map(b=>b.high)) + Math.min(...sl.map(b=>b.low))) / 2;
  };
  const tk = midN(9), kj = midN(26), skb = midN(52);
  const ska = (tk!=null&&kj!=null) ? (tk+kj)/2 : null;
  const lastClose = C[n-1];
  const prevTk = n>1 ? (()=>{ const sl=bars.slice(Math.max(0,n-10),n-1); return (Math.max(...sl.map(b=>b.high))+Math.min(...sl.map(b=>b.low)))/2; })() : null;
  const prevKj = n>1 ? (()=>{ const sl=bars.slice(Math.max(0,n-27),n-1); return (Math.max(...sl.map(b=>b.high))+Math.min(...sl.map(b=>b.low)))/2; })() : null;

  const aboveCloud = ska!=null && skb!=null && lastClose > ska && lastClose > skb;
  const belowCloud = ska!=null && skb!=null && lastClose < ska && lastClose < skb;
  const tkCrossUp = tk!=null&&kj!=null&&prevTk!=null&&prevKj!=null && tk>kj && prevTk<=prevKj;
  const tkCrossDn = tk!=null&&kj!=null&&prevTk!=null&&prevKj!=null && tk<kj && prevTk>=prevKj;

  let ichi_signal = 0;
  if (aboveCloud && tkCrossUp) ichi_signal = 1;
  else if (!aboveCloud && tkCrossDn) ichi_signal = -1;
  else if (aboveCloud) ichi_signal = 0.5;
  else if (belowCloud) ichi_signal = -0.5;

  return { ichi_signal: Math.round(ichi_signal), tenkan:tk, kijun:kj, senkou_a:ska, senkou_b:skb, aboveCloud, belowCloud };
}

// ══════════════════════════════════════════════════════
//  Layer 2: SMC (Smart Money Concepts)
// ══════════════════════════════════════════════════════
function computeSMC(bars) {
  const n = bars.length;
  if (n < 20) return { smc_signal: 0, bos: null, fvg: null, ob: null };
  const H = bars.map(b=>b.high), L = bars.map(b=>b.low), C = bars.map(b=>b.close), O = bars.map(b=>b.open);
  const sw = 10;
  const i = n - 1;

  // BOS
  const prevHiWindow = H.slice(Math.max(0,i-sw), i);
  const prevLoWindow = L.slice(Math.max(0,i-sw), i);
  const prevHi = Math.max(...prevHiWindow), prevLo = Math.min(...prevLoWindow);
  const bos_bull = C[i] > prevHi && C[i-1] <= prevHi;
  const bos_bear = C[i] < prevLo && C[i-1] >= prevLo;

  // FVG (Fair Value Gap)
  const fvg_bull = i>=2 && L[i] > H[i-2];
  const fvg_bear = i>=2 && H[i] < L[i-2];

  // Order Block
  const bearish = idx => C[idx] < O[idx];
  const ob_demand = i>=2 && bearish(i-1) && C[i] > H[i-1];
  const ob_supply = i>=2 && !bearish(i-1) && C[i] < L[i-1];

  let smc_signal = 0;
  if (bos_bull || fvg_bull || ob_demand) smc_signal = 1;
  if (bos_bear || fvg_bear || ob_supply) smc_signal = -1;

  const bos  = bos_bull ? '강세 BOS' : bos_bear ? '약세 BOS' : null;
  const fvg  = fvg_bull ? '상승 FVG' : fvg_bear ? '하락 FVG' : null;
  const ob   = ob_demand ? '수요 OB' : ob_supply ? '공급 OB' : null;

  return { smc_signal, bos, fvg, ob };
}

// ══════════════════════════════════════════════════════
//  Layer 3: 퀀트 팩터 스코어
// ══════════════════════════════════════════════════════
function computeQuantFactors(bars, ind) {
  const n = bars.length;
  const C = bars.map(b=>b.close);

  // 모멘텀
  const mom1m  = n>21  ? (C[n-1]-C[n-22])/C[n-22] : null;
  const mom3m  = n>63  ? (C[n-1]-C[n-64])/C[n-64] : null;
  const mom6m  = n>126 ? (C[n-1]-C[n-127])/C[n-127] : null;

  // 추세
  const ma20  = ind.sma20[n-1];
  const ma60  = n>=60 ? C.slice(n-60).reduce((a,b)=>a+b,0)/60 : null;
  const above_ma20  = ma20  != null ? (C[n-1] > ma20  ? 1 : -1) : 0;
  const above_ma60  = ma60  != null ? (C[n-1] > ma60  ? 1 : -1) : 0;

  // 변동성 (낮을수록 좋음 → 역배점)
  let vol20 = null;
  if (n >= 21) {
    const rets = C.slice(n-21).map((v,i,a)=>i>0?(v-a[i-1])/a[i-1]:null).filter(v=>v!=null);
    const mean = rets.reduce((a,b)=>a+b,0)/rets.length;
    vol20 = Math.sqrt(rets.reduce((a,b)=>a+(b-mean)**2,0)/rets.length) * Math.sqrt(252);
  }

  // RSI, MACD Hist, BB %B (from existing ind)
  const rsiV = last(ind.rsi), macdH = last(ind.hist), bbP = last(ind.bbPct);

  // Z-score normalization (simple: normalize within known ranges)
  function zscore(v, mean, std) { return std>0 ? (v-mean)/std : 0; }
  const momZ  = mom1m != null ? Math.tanh(mom1m * 5) : 0;
  const mom3Z = mom3m != null ? Math.tanh(mom3m * 3) : 0;
  const mom6Z = mom6m != null ? Math.tanh(mom6m * 2) : 0;
  const trendZ = (above_ma20 + above_ma60) / 2;
  const rsiZ   = rsiV != null ? (rsiV < 30 ? 0.8 : rsiV > 70 ? -0.8 : (50-rsiV)/50*0.4) : 0;
  const macdZ  = macdH != null ? Math.tanh(macdH / (last(ind.atr)||1) * 3) : 0;
  const bbZ    = bbP != null ? (1 - 2*bbP) * 0.5 : 0;
  const volZ   = vol20 != null ? -Math.tanh(vol20 * 2) * 0.5 : 0; // 역배점

  const factor_score = (momZ*0.2 + mom3Z*0.15 + mom6Z*0.1 + trendZ*0.15 + rsiZ*0.1 + macdZ*0.15 + bbZ*0.1 + volZ*0.05);
  const quant_signal = factor_score > 0.3 ? 1 : factor_score < -0.3 ? -1 : 0;

  return {
    quant_signal, factor_score,
    mom1m: mom1m != null ? mom1m*100 : null,
    mom3m: mom3m != null ? mom3m*100 : null,
    mom6m: mom6m != null ? mom6m*100 : null,
    vol20: vol20 != null ? vol20*100 : null,
    above_ma20, above_ma60,
  };
}

// ══════════════════════════════════════════════════════
//  Layer 5: 시그널 통합 (가중 평균)
// ══════════════════════════════════════════════════════
const MASTER_WEIGHTS = { cs: 1.5, ew: 2.0, ichi: 1.5, smc: 1.5, quant: 2.0 };

function fuseAdvancedSignals(cs, ew, ichi, smc, quant) {
  const signals = {
    cs:   cs.cs_signal,
    ew:   ew.ew_signal,
    ichi: ichi.ichi_signal,
    smc:  smc.smc_signal,
    quant: quant.quant_signal,
  };
  let wsum = 0, wtotal = 0;
  const details = {};
  for (const [key, w] of Object.entries(MASTER_WEIGHTS)) {
    const val = signals[key] || 0;
    wsum += val * w;
    wtotal += w;
    details[key] = { score: val, weight: w, label: val>0?'▲ 매수':val<0?'▼ 매도':'— 관망' };
  }
  const composite = wtotal > 0 ? wsum / wtotal : 0;
  return { composite, details };
}

// ══════════════════════════════════════════════════════
//  채점
// ══════════════════════════════════════════════════════
function last(arr) {
  for (let i=arr.length-1;i>=0;i--) if(arr[i]!=null) return arr[i];
  return null;
}

function scoreToSignal(s) {
  if (s >  0.6) return 'STRONG_BUY';
  if (s >  0.2) return 'BUY';
  if (s < -0.6) return 'STRONG_SELL';
  if (s < -0.2) return 'SELL';
  return 'NEUTRAL';
}

function norm(v, lo, mid, hi) {
  if (v<=lo) return -1; if (v>=hi) return 1;
  return v<mid ? (v-lo)/(mid-lo)-1 : (v-mid)/(hi-mid);
}
const normInv = (v,lo,mid,hi) => -norm(v,lo,mid,hi);

function scoreTechnical(ind, price) {
  const mh  = last(ind.hist),    atrV = last(ind.atr);
  const rsiV = last(ind.rsi),    bbP  = last(ind.bbPct);
  const k    = last(ind.stochK), d    = last(ind.stochD);
  const vr   = last(ind.volRatio);
  const C    = ind.C;
  const lastDiff = C[C.length-1] - C[C.length-2];

  const clip=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const macdScore = Math.tanh(mh / (atrV + 1e-9));
  let rsiScore = rsiV<30?(30-rsiV)/30 : rsiV>70?(70-rsiV)/30 : (50-rsiV)/50*0.3;
  rsiScore = clip(rsiScore,-1,1);
  const bbScore   = clip(1-2*bbP,-1,1);
  const stochScore= k<20&&k>d?0.8 : k>80&&k<d?-0.8 : (50-k)/50*0.3;
  const volScore  = Math.tanh(vr-1) * Math.sign(lastDiff);

  const score = macdScore*0.25 + rsiScore*0.20 + bbScore*0.20 + stochScore*0.15 + volScore*0.20;
  const signal = scoreToSignal(score);
  const conf   = Math.min(Math.abs(score)*1.5, 1.0);

  return {
    signal, score, confidence: conf, atr: atrV,
    indicators: {
      rsi: rsiV, macd: last(ind.macdLine), macdHist: mh,
      stochK: k, stochD: d, bbPct: bbP,
      bbUpper: last(ind.bbU), bbLower: last(ind.bbL), atr: atrV, volRatio: vr
    }
  };
}

function scoreFundamental(info, price) {
  const pct2num = v => (v!=null&&!isNaN(v)) ? (Math.abs(v)<2?v*100:v) : null;
  const g = (k, def) => { const v=info[k]; return (v!=null&&!isNaN(v)) ? v : def; };

  const per       = g('trailingPE',    25);
  const pbr       = g('priceToBook',    2);
  const roe       = pct2num(g('returnOnEquity', 0.10)) ?? 10;
  const netMargin = pct2num(g('profitMargins',  0.05)) ?? 5;
  const revGrowth = pct2num(g('revenueGrowth',  0.05)) ?? 5;
  const earnGrowth= pct2num(g('earningsGrowth', 0.05)) ?? 5;
  const debtEq    = g('debtToEquity',   100);
  const currRatio = g('currentRatio',   1.5);
  const divYield  = pct2num(g('dividendYield',   0))   ?? 0;

  const val    = (normInv(per,10,20,35) + normInv(pbr,0.8,2.0,4.0)) / 2;
  const prof   = (norm(roe,5,15,25)     + norm(netMargin,2,10,20))  / 2;
  const growth = (norm(revGrowth,0,10,30)+ norm(earnGrowth,0,15,40))/ 2;
  const health = (normInv(debtEq,50,100,200) + norm(currRatio,1.0,1.5,3.0)) / 2;

  const score = val*0.30 + prof*0.25 + growth*0.25 + health*0.20;
  const intrinsic = price * (score*0.3+1.0);

  return {
    signal: scoreToSignal(score), score,
    confidence: Math.min(Math.abs(score)*1.2, 1.0),
    intrinsic,
    metrics: { per, pbr, roe, netMargin, revGrowth, earnGrowth, debtEq, currRatio, divYield }
  };
}

function makeDecision(tech, fund, style, price, advanced) {
  const W = { short_term:[0.75,0.25], balanced:[0.60,0.40], long_term:[0.35,0.65] };
  const [tw, fw] = W[style] || W.balanced;

  // Base combined score from tech + fundamental
  let baseCombined = tech.score*tw + fund.score*fw;

  // Blend with advanced signal fusion (weight: 40% advanced, 60% base)
  const advW = 0.40;
  const adv = advanced || { composite: 0 };
  let combined = baseCombined*(1-advW) + adv.composite*advW;

  let conf = tech.confidence*tw + fund.confidence*fw;
  const reasoning = [];
  const sameDir = (tech.score>0&&fund.score>0)||(tech.score<0&&fund.score<0);
  if (sameDir) { conf=Math.min(conf*1.2,1.0); reasoning.push('기술/기본 신호 방향 일치 → 신뢰도 상승'); }
  else          { conf*=0.8;                   reasoning.push('기술/기본 신호 방향 불일치 → 신뢰도 하락'); }

  // Advanced signal alignment bonus
  if (adv.composite > 0.3 && combined > 0) { conf=Math.min(conf*1.1,1.0); reasoning.push(`고급 분석 복합점수(${adv.composite.toFixed(2)}) 매수 방향 일치`); }
  if (adv.composite < -0.3 && combined < 0) { conf=Math.min(conf*1.1,1.0); reasoning.push(`고급 분석 복합점수(${adv.composite.toFixed(2)}) 매도 방향 일치`); }

  let action;
  if (combined>0.25&&conf>0.5) {
    action='BUY';
    reasoning.push(`통합 점수 ${combined.toFixed(2)} (매수 기준 0.25 초과)`);
    if (fund.intrinsic>price) reasoning.push(`내재가치(${Math.round(fund.intrinsic).toLocaleString()}) > 현재가 → 저평가`);
  } else if (combined<-0.25&&conf>0.5) {
    action='SELL';
    reasoning.push(`통합 점수 ${combined.toFixed(2)} (매도 기준 -0.25 미만)`);
  } else {
    action='HOLD';
    reasoning.push(`신호 강도(${combined.toFixed(2)}) 또는 신뢰도(${(conf*100).toFixed(0)}%) 불충분 → 관망`);
  }

  // ── 목표가·손절가: 최종 action 기준으로 계산 ──
  const atr = tech.atr;
  let targetPrice, stopLoss;
  if (action === 'BUY') {
    targetPrice = price + atr * 2.5;
    stopLoss    = price - atr * 1.0;
  } else if (action === 'SELL') {
    targetPrice = price - atr * 2.5;
    stopLoss    = price + atr * 1.0;
  } else {
    targetPrice = price + atr * 1.5;
    stopLoss    = price - atr * 1.0;
  }

  const risk=Math.abs(price-stopLoss), reward=Math.abs(targetPrice-price);
  const rr = risk>0 ? Math.round(reward/risk*10)/10 : 0;
  if (rr<2.0&&action!=='HOLD') reasoning.push(`RR비율(${rr.toFixed(1)}:1) 불량 → 진입 재검토 권고`);

  return {
    action, confidence: Math.round(conf*1000)/1000,
    targetPrice, stopLoss, rr,
    techScore: tech.score, fundScore: fund.score,
    combined: Math.round(combined*10000)/10000,
    advancedComposite: Math.round(adv.composite*1000)/1000,
    reasoning
  };
}

let priceChart, rsiChart, macdChart;

// 티커 형식 판별: AAPL / 005930.KS / QQQ 등 → true, "삼성전자" → false
// 진짜 티커 형식: 1~5 대문자+숫자, 숫자코드.KS/.KQ, 또는 ^로 시작하는 지수
function looksLikeTicker(q) {
  const t = q.trim().toUpperCase();
  // 숫자 6자리 코드 (한국 종목코드 단독 입력)
  if (/^\d{6}$/.test(t)) return true;
  // 티커.거래소 형식 (005930.KS, 086520.KQ)
  if (/^\d{6}\.(KS|KQ|T|HK|SS|SZ)$/i.test(t)) return true;
  // 영미 티커: 1~5자 대문자 (공백·특수문자 없음, 순수 대문자만)
  if (/^[A-Z]{1,5}$/.test(t)) return true;
  // BRK.A, BRK.B 형식
  if (/^[A-Z]{1,4}\.[AB]$/.test(t)) return true;
  return false;
}

async function resolveTicker(input) {
  const q = input.trim();

  // 1) 내장 사전 (한국어·영어 종목명 → 티커)
  const dictHit = krDictSearch(q);
  if (dictHit.length) return dictHit[0].symbol;

  // 2) 티커 형식이면 바로 반환
  if (looksLikeTicker(q)) return q.toUpperCase();

  // 3) Yahoo Finance 검색
  const results = await searchTickers(q);
  if (results.length) return results[0].symbol;

  throw new Error(`"${q}"에 해당하는 종목을 찾을 수 없습니다. 티커로 직접 입력해보세요 (예: 042700.KS, AAPL)`);
}

async function runAnalysis() {
  const raw    = document.getElementById('ticker-input').value.trim();
  const period = document.getElementById('period-select').value;
  const style  = document.getElementById('style-select').value;
  if (!raw) return;

  const dash = document.getElementById('dashboard');
  const btn  = document.getElementById('run-btn');
  btn.disabled = true;
  hideAC();

  // destroy existing charts
  [priceChart, rsiChart, macdChart].forEach(c => c?.destroy());
  priceChart = rsiChart = macdChart = null;

  dash.innerHTML = `<div class="center-msg"><div class="spinner"></div><div>"${raw}" 종목 검색 중…</div></div>`;

  let ticker;
  try {
    ticker = await resolveTicker(raw);
    // 입력란에 실제 티커로 업데이트
    document.getElementById('ticker-input').value = ticker;
  } catch(e) {
    dash.innerHTML = `<div class="center-msg"><div class="icon">⚠️</div>
      <div style="color:var(--red);font-weight:600;margin-bottom:8px;">종목 검색 실패</div>
      <div>${e.message}</div></div>`;
    btn.disabled = false;
    return;
  }

  dash.innerHTML = `<div class="center-msg"><div class="spinner"></div><div>${ticker} 데이터 수집 중…</div></div>`;

  try {
    const [ohlcvData, fundInfo, quote] = await Promise.all([
      fetchOHLCV(ticker, period),
      fetchFundamentals(ticker),
      fetchQuote(ticker),
    ]);

    const { bars, currency, regularMarketPrice, previousClose, marketState, dataUpdatedAt } = ohlcvData;

    // 최신 가격 우선순위: 실시간 quote → chart meta → 마지막 봉 종가
    const price   = quote?.regularMarketPrice || regularMarketPrice || bars[bars.length-1].close;
    const prevClose = quote?.regularMarketPreviousClose || previousClose || bars[bars.length-2]?.close;
    const changeAmt = prevClose ? price - prevClose : null;
    const changePct = prevClose ? (price / prevClose - 1) * 100 : null;
    const high52w   = quote?.fiftyTwoWeekHigh || null;
    const low52w    = quote?.fiftyTwoWeekLow  || null;
    const mktState  = quote?.marketState || marketState;
    const updatedAt = quote?.regularMarketTime
      ? new Date(quote.regularMarketTime * 1000) : dataUpdatedAt;
    const isKr = currency === 'KRW';

    dash.innerHTML = `<div class="center-msg"><div class="spinner"></div><div>${ticker} 분석 중…</div></div>`;

    const ind      = computeIndicators(bars);
    const tech     = scoreTechnical(ind, price);
    const fund     = scoreFundamental(fundInfo, price);

    // Layer 2: Advanced technical analysis
    const cs       = computeCandlestick(bars);
    const ew       = computeElliottWave(bars);
    const ichi     = computeIchimoku(bars);
    const smc      = computeSMC(bars);
    // Layer 3: Quant factors
    const quant    = computeQuantFactors(bars, ind);
    // Layer 5: Signal fusion
    const advanced = fuseAdvancedSignals(cs, ew, ichi, smc, quant);

    const decision = makeDecision(tech, fund, style, price, advanced);

    // 검색 기록 저장
    saveHistory(ticker, fundInfo.companyName || ticker);

    renderDashboard({
      ticker, bars, ind, tech, fund, decision, price, isKr, currency,
      companyName: fundInfo.companyName || resolveTickerName(ticker) || ticker,
      sector: fundInfo.sector || '-',
      changeAmt, changePct, high52w, low52w, mktState, updatedAt,
      fundInfo, cs, ew, ichi, smc, quant, advanced,
    });

  } catch(e) {
    dash.innerHTML = `
      <div class="center-msg">
        <div class="icon">⚠️</div>
        <div style="color:var(--red);font-weight:600;margin-bottom:8px;">분석 실패</div>
        <div style="margin-bottom:8px">${e.message}</div>
        <div style="font-size:0.8rem;color:var(--muted)">
          한국 주식: 005930.KS (KOSPI) · 086520.KQ (KOSDAQ)
        </div>
      </div>`;
  } finally { btn.disabled = false; }
}

          smc:  '기관·세력 거래 흔적 분석\nBOS·FVG·OB 중 하나라도 매수 신호면 +1\n모두 없거나 반대면 0/-1',
          quant:'모멘텀·추세·RSI·MACD·BB %B 팩터\nZ-스코어 가중 평균 → -1~+1 스코어',
        };
        const c = v.score>0?'var(--green)':v.score<0?'var(--red)':'var(--muted)';
        return `<div class="metric-row"><span>${nameMap[key]||key} <span style="font-size:0.6rem;color:var(--muted)">w=${v.weight}</span>${tip(tipMap[key]||'')}</span><span class="metric-val" style="color:${c}">${v.label}</span></div>`;
      }).join('')}
      <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;font-size:0.78rem">
        <span style="color:var(--muted)">복합점수 ${tip('각 시그널을 가중치로 평균한 값\n> +0.3 → LONG 신호\n< -0.3 → SHORT 신호\n그 외 → STAND ASIDE')}</span>
        <span style="float:right;font-weight:700;color:${d.advancedComposite>0.2?'var(--green)':d.advancedComposite<-0.2?'var(--red)':'var(--yellow)'}">${d.advancedComposite.toFixed(3)}</span>
      </div>
    </div>

    <!-- 캔들스틱 패턴 -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--yellow)"></span>캔들스틱 패턴 ${tip('최근 1~3일 봉 형태로 단기 방향 감지\n강세: Hammer, BullishEngulfing,\n  MorningStar, ThreeWhiteSoldiers 등\n약세: ShootingStar, BearishEngulfing,\n  EveningStar, ThreeBlackCrows 등')}</div>
      ${mrow('패턴 시그널', cs.cs_signal>0?'▲ 매수':cs.cs_signal<0?'▼ 매도':'— 중립', cs.cs_signal>0?'var(--green)':cs.cs_signal<0?'var(--red)':'var(--muted)', '강세 패턴 수 - 약세 패턴 수\n양수 → 매수 신호\n음수 → 매도 신호\n0 → 패턴 없거나 중립')}
      ${mrow('감지 패턴 수', cs.patterns.length+'개', '', '오늘 봉 포함 최근 3봉에서\n감지된 캔들스틱 패턴 총 개수')}
      ${cs.patterns.length>0
        ? cs.patterns.map(p=>`<div style="margin-top:4px;font-size:0.72rem;padding:3px 7px;border-radius:10px;display:inline-block;background:var(--border);color:var(--text2);margin-right:4px">${p}</div>`).join('')
        : '<div style="font-size:0.72rem;color:var(--muted);margin-top:6px">감지된 패턴 없음</div>'}
    </div>

    <!-- 엘리어트 파동 -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--blue)"></span>엘리어트 파동 · 피보나치 ${tip(TIPS.elliott.title, TIPS.elliott.body)}</div>
      ${mrow('파동 상태', ew.wave_label, ew.ew_signal>0?'var(--green)':ew.ew_signal<0?'var(--red)':'var(--muted)', TIPS.ewState.title, TIPS.ewState.body)}
      ${mrow('피봇 고점', fmt(ew.pivot_high,isKr), '', TIPS.pivotHigh.title, TIPS.pivotHigh.body)}
      ${mrow('피봇 저점', fmt(ew.pivot_low,isKr), '', TIPS.pivotLow.title, TIPS.pivotLow.body)}
      ${Object.entries(ew.entry_zone||{}).length
        ? `<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;font-size:0.7rem;color:var(--muted)">진입 구간 ${tip(TIPS.entryZone.title, TIPS.entryZone.body)}</div>`
          + Object.entries(ew.entry_zone).map(([k,v])=>`<div class="metric-row"><span style="font-size:0.72rem">${k}</span><span class="metric-val" style="color:var(--yellow)">${fmt(v,isKr)}</span></div>`).join('')
        : ''}
    </div>

    <!-- 이치모쿠 -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--purple)"></span>이치모쿠 균형표 ${tip(TIPS.ichimoku.title, TIPS.ichimoku.body)}</div>
      ${mrow('신호', ichi.ichi_signal>0?'▲ 매수':ichi.ichi_signal<0?'▼ 매도':'— 관망', ichi.ichi_signal>0?'var(--green)':ichi.ichi_signal<0?'var(--red)':'var(--muted)', TIPS.ichiSignal.title, TIPS.ichiSignal.body)}
      ${mrow('전환선 (9)', ichi.tenkan!=null?fmt(ichi.tenkan,isKr):'-', '', TIPS.ichimoku.title, TIPS.ichimoku.body)}
      ${mrow('기준선 (26)', ichi.kijun!=null?fmt(ichi.kijun,isKr):'-', '', TIPS.ichimoku.title, TIPS.ichimoku.body)}
      ${mrow('구름 위치', ichi.aboveCloud?'구름 위 (강세)':ichi.belowCloud?'구름 아래 (약세)':'구름 안 (중립)', ichi.aboveCloud?'var(--green)':ichi.belowCloud?'var(--red)':'var(--yellow)', TIPS.ichiSignal.title, TIPS.ichiSignal.body)}
    </div>

    <!-- SMC -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--red)"></span>SMC · 스마트머니 ${tip(TIPS.smc.title, TIPS.smc.body)}</div>
      ${mrow('BOS', smc.bos||'없음', smc.bos&&smc.bos.includes('강세')?'var(--green)':smc.bos?'var(--red)':'var(--muted)', TIPS.bos.title, TIPS.bos.body)}
      ${mrow('FVG', smc.fvg||'없음', smc.fvg&&smc.fvg.includes('상승')?'var(--green)':smc.fvg?'var(--red)':'var(--muted)', TIPS.fvg.title, TIPS.fvg.body)}
      ${mrow('Order Block', smc.ob||'없음', smc.ob&&smc.ob.includes('수요')?'var(--green)':smc.ob?'var(--red)':'var(--muted)', TIPS.ob.title, TIPS.ob.body)}
      ${mrow('SMC 시그널', smc.smc_signal>0?'▲ 매수':smc.smc_signal<0?'▼ 매도':'— 중립', smc.smc_signal>0?'var(--green)':smc.smc_signal<0?'var(--red)':'var(--muted)', TIPS.smcSignal.title, TIPS.smcSignal.body)}
    </div>

    <!-- 퀀트 팩터 -->
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--green)"></span>퀀트 팩터 ${tip(TIPS.quant.title, TIPS.quant.body)}</div>
      ${mrow('팩터 스코어', quant.factor_score.toFixed(3), quant.factor_score>0.3?'var(--green)':quant.factor_score<-0.3?'var(--red)':'var(--yellow)', TIPS.factorScore.title, TIPS.factorScore.body)}
      ${mrow('모멘텀 1M', quant.mom1m!=null?(quant.mom1m>0?'+':'')+quant.mom1m.toFixed(1)+'%':'-', quant.mom1m!=null&&quant.mom1m>0?'var(--green)':quant.mom1m!=null?'var(--red)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('모멘텀 3M', quant.mom3m!=null?(quant.mom3m>0?'+':'')+quant.mom3m.toFixed(1)+'%':'-', quant.mom3m!=null&&quant.mom3m>0?'var(--green)':quant.mom3m!=null?'var(--red)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('모멘텀 6M', quant.mom6m!=null?(quant.mom6m>0?'+':'')+quant.mom6m.toFixed(1)+'%':'-', quant.mom6m!=null&&quant.mom6m>0?'var(--green)':quant.mom6m!=null?'var(--red)':'', TIPS.momentum.title, TIPS.momentum.body)}
      ${mrow('MA20', quant.above_ma20>0?'위 (강세)':'아래 (약세)', quant.above_ma20>0?'var(--green)':'var(--red)', TIPS.maPos.title, TIPS.maPos.body)}
      ${mrow('MA60', quant.above_ma60>0?'위 (강세)':'아래 (약세)', quant.above_ma60>0?'var(--green)':'var(--red)', TIPS.maPos.title, TIPS.maPos.body)}
      ${mrow('연환산 변동성', quant.vol20!=null?quant.vol20.toFixed(1)+'%':'-', '', TIPS.volatility.title, TIPS.volatility.body)}
    </div>

  </div>

  <!-- ── Row 3: 기술적·기본적 지표 테이블 (2열) ── -->
  <div class="row row-bottom">
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--purple)"></span>기술적 지표</div>
      ${mrow('RSI (14)', I.rsi?.toFixed(1), I.rsi<30?'var(--green)':I.rsi>70?'var(--red)':'', TIPS.rsi.title, TIPS.rsi.body)}
      ${mrow('Stoch %K', I.stochK?.toFixed(1), '', TIPS.stochK.title, TIPS.stochK.body)}
      ${mrow('Stoch %D', I.stochD?.toFixed(1), '', TIPS.stochD.title, TIPS.stochD.body)}
      ${mrow('MACD', I.macd?.toFixed(4), '', TIPS.macd.title, TIPS.macd.body)}
      ${mrow('MACD Hist', I.macdHist?.toFixed(4), I.macdHist>0?'var(--green)':'var(--red)', TIPS.macdHist.title, TIPS.macdHist.body)}
      ${mrow('BB %', I.bbPct!=null?(I.bbPct*100).toFixed(1)+'%':'-', '', TIPS.bbPct.title, TIPS.bbPct.body)}
      ${mrow('ATR', I.atr!=null?fmt(I.atr,isKr):'-', '', TIPS.atr.title, TIPS.atr.body)}
      ${mrow('거래량 비율', I.volRatio!=null?I.volRatio.toFixed(2)+'x':'-', I.volRatio>1?'var(--green)':'var(--red)', TIPS.volRatio.title, TIPS.volRatio.body)}
    </div>
    <div class="card">
      <div class="card-header"><span class="dot" style="background:var(--yellow)"></span>기본적 지표</div>
      ${mrow('PER', M.per!=null?M.per.toFixed(1)+'x':'-', '', TIPS.per.title, TIPS.per.body)}
      ${mrow('PBR', M.pbr!=null?M.pbr.toFixed(2)+'x':'-', '', TIPS.pbr.title, TIPS.pbr.body)}
      ${mrow('ROE', M.roe!=null?M.roe.toFixed(1)+'%':'-', M.roe>10?'var(--green)':'var(--red)', TIPS.roe.title, TIPS.roe.body)}
      ${mrow('순이익률', M.netMargin!=null?M.netMargin.toFixed(1)+'%':'-', '', TIPS.netMargin.title, TIPS.netMargin.body)}
      ${mrow('매출성장률', M.revGrowth!=null?(M.revGrowth>0?'+':'')+M.revGrowth.toFixed(1)+'%':'-', M.revGrowth>0?'var(--green)':'var(--red)', TIPS.revGrowth.title, TIPS.revGrowth.body)}
      ${mrow('이익성장률', M.earnGrowth!=null?(M.earnGrowth>0?'+':'')+M.earnGrowth.toFixed(1)+'%':'-', M.earnGrowth>0?'var(--green)':'var(--red)', TIPS.earnGrowth.title, TIPS.earnGrowth.body)}
      ${mrow('부채비율', M.debtEq!=null?M.debtEq.toFixed(0)+'%':'-', '', TIPS.debtEq.title, TIPS.debtEq.body)}
      ${mrow('배당수익률', M.divYield!=null?M.divYield.toFixed(2)+'%':'-', '', TIPS.divYield.title, TIPS.divYield.body)}
      ${mrow('내재가치', fmt(fund.intrinsic,isKr)+' '+currency, fund.intrinsic>price?'var(--green)':'var(--red)', TIPS.intrinsic.title, TIPS.intrinsic.body)}
    </div>
  </div>

  <!-- ── Row 4: 차트 (최하단) ── -->
  <div class="card" style="padding:14px 16px;margin-top:0">
    <div class="card-header"><span class="dot" style="background:var(--green)"></span>종가 · Bollinger Band</div>
    <div class="chart-container"><canvas id="priceChart"></canvas></div>
    <div id="bbEntryPanel" style="margin-top:10px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
      <div>
        <div class="card-header"><span class="dot" style="background:var(--purple)"></span>RSI (14)</div>
        <div class="chart-container-sm"><canvas id="rsiChart"></canvas></div>
        <div id="rsiEntryPanel" style="margin-top:8px"></div>
      </div>
      <div>
        <div class="card-header"><span class="dot" style="background:var(--blue)"></span>MACD</div>
        <div class="chart-container-sm"><canvas id="macdChart"></canvas></div>
        <div id="macdEntryPanel" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
  `;

  // ══════════════════════════════════════════════════════
  // ── 분석 포인트 & 진입점 감지 ──
  // ══════════════════════════════════════════════════════
  const fmt = v => isKr ? v?.toLocaleString('ko-KR') : v?.toFixed(2);

  // ── [BB] 신호 ──
  const bbBandwidth = closes.map((c,i) =>
    (ind.bbU[i]!=null && ind.sma20[i]) ? (ind.bbU[i]-ind.bbL[i])/ind.sma20[i] : null);
  const bwArr = bbBandwidth.filter(v=>v!=null).sort((a,b)=>a-b);
  const bwQ20 = bwArr[Math.floor(bwArr.length*0.20)] || 0.03;
  const bbSqueeze   = closes.map((c,i) => bbBandwidth[i]!=null && bbBandwidth[i]<=bwQ20 ? ind.sma20[i] : null);
  const bbUpperTouch= closes.map((c,i) => ind.bbU[i]!=null && c>=ind.bbU[i]*0.999 ? c : null);
  const bbLowerTouch= closes.map((c,i) => ind.bbL[i]!=null && c<=ind.bbL[i]*1.001 ? c : null);
  const sma20CrossUp= closes.map((c,i) => i>0&&ind.sma20[i]!=null&&closes[i-1]<ind.sma20[i-1]&&c>=ind.sma20[i] ? c : null);
  const sma20CrossDn= closes.map((c,i) => i>0&&ind.sma20[i]!=null&&closes[i-1]>ind.sma20[i-1]&&c<=ind.sma20[i] ? c : null);
  // 진입점: BB 하단 이탈 후 회복 (매수) / BB 상단 이탈 후 재진입 (매도)
  const bbBuyEntry  = closes.map((c,i) => i>0&&ind.bbL[i]!=null&&closes[i-1]<=ind.bbL[i-1]*1.001&&c>ind.bbL[i]*1.001 ? c : null);
  const bbSellEntry = closes.map((c,i) => i>0&&ind.bbU[i]!=null&&closes[i-1]>=ind.bbU[i-1]*0.999&&c<ind.bbU[i]*0.999 ? c : null);

  // ── [RSI] 신호 ──
  const rsiOB      = ind.rsi.map((r,i) => r!=null&&r>=70&&(i===0||ind.rsi[i-1]<70) ? r : null);
  const rsiOS      = ind.rsi.map((r,i) => r!=null&&r<=30&&(i===0||ind.rsi[i-1]>30) ? r : null);
  const rsi50Up    = ind.rsi.map((r,i) => r!=null&&i>0&&r>=50&&ind.rsi[i-1]<50 ? r : null);
  const rsi50Dn    = ind.rsi.map((r,i) => r!=null&&i>0&&r<=50&&ind.rsi[i-1]>50 ? r : null);
  const rsiDivBull = ind.rsi.map((r,i) => {
    if(r==null||i<5) return null;
    const prevLowIdx = ind.rsi.slice(0,i).reduce((a,v,j)=>v!=null&&v<(ind.rsi[a]||Infinity)?j:a,0);
    return closes[i]<closes[prevLowIdx]&&r>ind.rsi[prevLowIdx] ? r : null;
  });
  // 진입점: 과매도 구간 탈출(매수) / 과매수 구간 탈출(매도)
  const rsiBuyEntry = ind.rsi.map((r,i) => r!=null&&i>0&&r>30&&ind.rsi[i-1]!=null&&ind.rsi[i-1]<=30 ? r : null);
  const rsiSellEntry= ind.rsi.map((r,i) => r!=null&&i>0&&r<70&&ind.rsi[i-1]!=null&&ind.rsi[i-1]>=70 ? r : null);

  // ── [MACD] 신호 ──
  const macdGolden = ind.macdLine.map((m,i) => {
    if(m==null||ind.sigLine[i]==null||i===0) return null;
    return m>ind.sigLine[i]&&ind.macdLine[i-1]<=ind.sigLine[i-1] ? m : null;
  });
  const macdDead   = ind.macdLine.map((m,i) => {
    if(m==null||ind.sigLine[i]==null||i===0) return null;
    return m<ind.sigLine[i]&&ind.macdLine[i-1]>=ind.sigLine[i-1] ? m : null;
  });
  const histCrossUp= ind.hist.map((h,i) => h!=null&&i>0&&ind.hist[i-1]!=null&&h>=0&&ind.hist[i-1]<0 ? h : null);
  const histCrossDn= ind.hist.map((h,i) => h!=null&&i>0&&ind.hist[i-1]!=null&&h<=0&&ind.hist[i-1]>0 ? h : null);
  const histPeak   = ind.hist.map((h,i) => {
    if(h==null||i<1||ind.hist[i-1]==null||ind.hist[i+1]==null) return null;
    const p=ind.hist[i-1],n=ind.hist[i+1];
    return (h>0&&h>p&&h>n)||(h<0&&h<p&&h<n) ? h : null;
  });
  // 진입점: 골든크로스(매수) / 데드크로스(매도)
  const macdBuyEntry = macdGolden;
  const macdSellEntry= macdDead;

  // ══════════════════════════════════════════════════════
  // ── 진입점 설명 패널 렌더링 ──
  // ══════════════════════════════════════════════════════
  function entryRow(side, date, price, reason) {
    const isBuy = side === 'BUY';
    const color = isBuy ? 'var(--green)' : 'var(--red)';
    const icon  = isBuy ? '▲' : '▼';
    const label = isBuy ? '매수 진입' : '매도 준비';
    return `<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
      <span style="min-width:68px;font-size:0.72rem;color:${color};font-weight:700;white-space:nowrap">${icon} ${label}</span>
      <span style="min-width:64px;font-size:0.72rem;color:var(--muted);white-space:nowrap">${date}</span>
      <span style="min-width:72px;font-size:0.72rem;color:var(--text2);white-space:nowrap">${price}</span>
      <span style="font-size:0.72rem;color:var(--text2);line-height:1.4">${reason}</span>
    </div>`;
  }
  function renderEntryPanel(elId, rows) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!rows.length) { el.innerHTML = ''; return; }
    el.innerHTML = `<div style="background:var(--card2,#0f1923);border-radius:8px;padding:8px 12px;margin-top:2px">
      <div style="font-size:0.72rem;color:var(--muted);margin-bottom:4px;font-weight:600">📍 진입점 이력 (최근 ${rows.length}건)</div>
      ${rows.join('')}
    </div>`;
  }

  // BB 진입점 수집
  const bbEntries = [];
  closes.forEach((c,i) => {
    if (bbBuyEntry[i]!=null)
      bbEntries.push(entryRow('BUY', labels[i], fmt(c),
        `BB 하단 이탈 후 반등 복귀. 과매도 압력 해소·저점 매수 진입 구간. 손절: BB 하단 재이탈 시`));
    if (bbSellEntry[i]!=null)
      bbEntries.push(entryRow('SELL', labels[i], fmt(c),
        `BB 상단 이탈 후 밴드 내 복귀. 과열 해소·단기 차익실현 구간. 재진입: BB 중심선(MA20) 복귀 시 확인`));
  });

  // RSI 진입점 수집
  const rsiEntries = [];
  ind.rsi.forEach((r,i) => {
    if (rsiBuyEntry[i]!=null)
      rsiEntries.push(entryRow('BUY', labels[i], `RSI ${r?.toFixed(1)}`,
        `RSI 과매도(≤30) 탈출. 매도 세력 소진·반등 모멘텀 시작. 확인: MA20 위 종가 마감 시 강도 높아짐`));
    if (rsiSellEntry[i]!=null)
      rsiEntries.push(entryRow('SELL', labels[i], `RSI ${r?.toFixed(1)}`,
        `RSI 과매수(≥70) 탈출. 매수 세력 피로·단기 고점 형성 가능. 확인: MACD 데드크로스 동반 시 강력 매도 신호`));
  });

  // MACD 진입점 수집
  const macdEntries = [];
  ind.macdLine.forEach((m,i) => {
    if (macdBuyEntry[i]!=null)
      macdEntries.push(entryRow('BUY', labels[i], `MACD ${m?.toFixed(3)}`,

    .map(([name, sym]) => ({ symbol: sym, longname: name, exchDisp: 'KRX' }));
  return matches;
}

// CORS 프록시 목록 (순차 시도)
const PROXIES = [
  'https://corsproxy.io/?url=',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.org/?',
];

async function fetchWithProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const resp = await fetch(proxy + encodeURIComponent(url));
      if (resp.ok) return resp;
    } catch { /* 다음 프록시 시도 */ }
  }
  throw new Error('모든 프록시 실패');
}

async function searchTickers(q) {
  // 1) 내장 한국 사전
  const dictHits = krDictSearch(q);
  // 2) 내장 영어 사전
  const enHits = enDictSearch(q);

  // 3) Yahoo Finance API 검색
  const searchUrl = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0&enableFuzzyQuery=true`;
  let apiHits = [];
  try {
    const resp = await fetchWithProxy(searchUrl);
    const json = await resp.json();
    apiHits = (json.quotes || []).filter(r => r.symbol && r.quoteType !== 'OPTION');
  } catch { /* API 실패 시 사전 결과만 사용 */ }

  // 합치기 (중복 제거)
  const seen = new Set();
  const combined = [...dictHits, ...enHits, ...apiHits].filter(r => {
    if (seen.has(r.symbol)) return false;
    seen.add(r.symbol); return true;
  });
  return combined;
}

function showAC(items) {
  const list = document.getElementById('ac-list');
  acIdx = -1;
  if (!items.length) { list.style.display = 'none'; return; }

  list.innerHTML = items.map((r, i) => {
    const exchFlag = r.exchange?.startsWith('KO') || r.symbol?.endsWith('.KS') || r.symbol?.endsWith('.KQ') ? '🇰🇷 ' : '🇺🇸 ';
    const name = r.longname || r.shortname || r.symbol;
    return `<div class="ac-item" data-sym="${r.symbol}" data-idx="${i}"
      onmousedown="pickAC('${r.symbol}')">
      <span class="ac-ticker">${r.symbol}</span>
      <span class="ac-name">${name}</span>
      <span class="ac-exch">${exchFlag}${r.exchDisp || r.exchange || ''}</span>
    </div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAC() { document.getElementById('ac-list').style.display = 'none'; acIdx = -1; }

function pickAC(sym) {
  document.getElementById('ticker-input').value = sym;
  hideAC();
  runAnalysis();
}

function moveAC(dir) {
  const list = document.getElementById('ac-list');
  const items = list.querySelectorAll('.ac-item');
  if (!items.length) return;
  items[acIdx]?.classList.remove('ac-active');
  acIdx = (acIdx + dir + items.length) % items.length;
  items[acIdx].classList.add('ac-active');
  document.getElementById('ticker-input').value = items[acIdx].dataset.sym;
}

const tickerInput = document.getElementById('ticker-input');

tickerInput.addEventListener('input', () => {
  clearTimeout(acTimer);
  const q = tickerInput.value.trim();
  if (q.length < 1) { hideAC(); return; }
  document.getElementById('ac-list').innerHTML = '<div class="ac-loading">검색 중…</div>';
  document.getElementById('ac-list').style.display = 'block';
  acTimer = setTimeout(async () => {
    try {
      const results = await searchTickers(q);
      showAC(results);
    } catch { hideAC(); }
  }, 300);
});

tickerInput.addEventListener('keydown', e => {
  const list = document.getElementById('ac-list');
  if (list.style.display !== 'none') {
    if (e.key === 'ArrowDown')  { e.preventDefault(); moveAC(1);  return; }
    if (e.key === 'ArrowUp')    { e.preventDefault(); moveAC(-1); return; }
    if (e.key === 'Escape')     { hideAC(); return; }
    if (e.key === 'Enter' && acIdx >= 0) { e.preventDefault(); pickAC(list.querySelectorAll('.ac-item')[acIdx].dataset.sym); return; }
  }
  if (e.key === 'Enter') runAnalysis();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-outer')) hideAC();
});
