name: M3 Qualitative Analysis

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '종목코드 (예: AAPL, 005930)'
        required: true
        type: string
      market:
        description: '시장'
        required: true
        default: 'US'
        type: choice
        options: [US, KR]
      year:
        description: '회계연도 (예: 2024)'
        required: true
        type: string
      doc_type:
        description: '문서 유형'
        required: true
        default: 'annual_report'
        type: choice
        options: [annual_report, earnings_call]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ inputs.market }}-v1

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run qualitative analysis
        env:
          DART_API_KEY:  ${{ secrets.DART_API_KEY }}
          FMP_API_KEY:   ${{ secrets.FMP_API_KEY }}
        run: |
          python scripts/analyze_qualitative.py \
            --ticker "${{ inputs.ticker }}" \
            --market "${{ inputs.market }}" \
            --year   "${{ inputs.year }}" \
            --doc_type "${{ inputs.doc_type }}"

      - name: Commit analysis result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/qualitative/
          git diff --staged --quiet || git commit -m "feat: M3 analysis ${{ inputs.ticker }} ${{ inputs.year }} ${{ inputs.doc_type }}"
          git push
