name: Update Market Data

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 KST 10:00 (UTC 01:00) — 기술적 데이터
    - cron: '0 1 * * 1'   # 매주 월요일 KST 10:00 — 펀더멘털 + 해자
  workflow_dispatch:
    inputs:
      scope:
        description: '갱신 범위'
        required: false
        default: 'all'
        type: choice
        options: [all, technical, fundamentals, moat]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch technical data (daily)
        if: github.event.schedule == '0 1 * * *' || inputs.scope == 'all' || inputs.scope == 'technical'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_technical.py

      - name: Fetch fundamentals (weekly)
        if: github.event.schedule == '0 1 * * 1' || inputs.scope == 'all' || inputs.scope == 'fundamentals'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_fundamentals.py

      - name: Generate moat JSON (weekly)
        if: github.event.schedule == '0 1 * * 1' || inputs.scope == 'all' || inputs.scope == 'moat'
        run: python scripts/fetch_moat.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git diff --staged --quiet || git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d')"
          git push
